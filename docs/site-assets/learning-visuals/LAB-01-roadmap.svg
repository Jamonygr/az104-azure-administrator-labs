<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-01">
  <title id="roadmap-title">LAB-01 learning roadmap: Create and manage Microsoft Entra users and groups</title>
  <desc id="roadmap-desc">Create and manage Microsoft Entra users and groups. Follow five checkpoints in lesson order. Task 1, LAB01-CP01: Prove Graph access and validate the verified UPN domain. Task 2, LAB01-CP02: Create two cloud-only users and persist each ID immediately. Task 3, LAB01-CP03: Create the security group and add Alex as a member. Task 4, LAB01-CP04: Assign Blair as owner without making Blair a member. Task 5, LAB01-CP05: Operate the user lifecycle and reconcile the final identity inventory. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;identity-governance&quot;,&quot;labId&quot;:&quot;LAB-01&quot;,&quot;metadataSource&quot;:&quot;labs/01-entra-users-groups/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/01-entra-users-groups/README.md&quot;,&quot;sourceSha256&quot;:&quot;1b5799a9c2bdf7d71caf23a06aa38e23e39dee5221903b8840112b356891aaca&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The supplied domain appears exactly once with isVerified true, and the Graph request succeeds in the active tenant.&quot;,&quot;id&quot;:&quot;LAB01-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;IG-USERS-01&quot;],&quot;purpose&quot;:&quot;Confirm the active tenant, enumerate only verified domains, and stop if the supplied domain cannot host a cloud-only user.&quot;,&quot;title&quot;:&quot;Prove Graph access and validate the verified UPN domain&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;Two enabled cloud-only users exist with unique UPNs, Operations department, and IDs already present in run.json.&quot;,&quot;id&quot;:&quot;LAB01-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;IG-USERS-02&quot;],&quot;purpose&quot;:&quot;Create Alex and Blair one at a time, recording each immutable object ID before attempting the next user.&quot;,&quot;title&quot;:&quot;Create two cloud-only users and persist each ID immediately&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;One security-enabled group exists and its direct members collection contains Alex but not Blair.&quot;,&quot;id&quot;:&quot;LAB01-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;IG-USERS-01&quot;],&quot;purpose&quot;:&quot;Establish a reusable authorization boundary and add only the first recorded user through an object-ID reference.&quot;,&quot;title&quot;:&quot;Create the security group and add Alex as a member&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;Blair is the sole explicit owner, Alex is the sole member, and the two object-ID sets do not overlap.&quot;,&quot;id&quot;:&quot;LAB01-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-USERS-02&quot;],&quot;purpose&quot;:&quot;Add the second user to the owners reference and prove that ownership does not imply membership.&quot;,&quot;title&quot;:&quot;Assign Blair as owner without making Blair a member&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Alex has the new job title, Blair is enabled again, and the final relationship inventory still has one distinct member and owner.&quot;,&quot;id&quot;:&quot;LAB01-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-USERS-01&quot;,&quot;IG-USERS-02&quot;],&quot;purpose&quot;:&quot;Update Alex&#x27;s job title, disable and re-enable Blair, then reconcile users, membership, ownership, and run.json by immutable ID.&quot;,&quot;title&quot;:&quot;Operate the user lifecycle and reconcile the final identity inventory&quot;}],&quot;title&quot;:&quot;Create and manage Microsoft Entra users and groups&quot;}</metadata>

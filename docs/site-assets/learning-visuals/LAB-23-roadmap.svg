<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1677" viewBox="0 0 640 1677" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-23">
  <title id="roadmap-title">LAB-23 learning roadmap: Build Azure Monitor alerts, action groups, and processing rules</title>
  <desc id="roadmap-desc">Build Azure Monitor alerts, action groups, and processing rules. Follow five checkpoints in lesson order. Task 1, LAB23-CP01: Verify metric, action-group, and processing-rule support. Task 2, LAB23-CP02: Create the monitored target and action group. Task 3, LAB23-CP03: Create a scoped metric alert. Task 4, LAB23-CP04: Apply a bounded alert-processing suppression rule. Task 5, LAB23-CP05: Reconcile alert scope, criteria, actions, and suppression. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;monitor-recovery&quot;,&quot;labId&quot;:&quot;LAB-23&quot;,&quot;metadataSource&quot;:&quot;labs/23-monitor-alerts-actions/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/23-monitor-alerts-actions/README.md&quot;,&quot;sourceSha256&quot;:&quot;67ea22c991c6cd1ec36c12f2497f556bb8699d070ef87331bc09360afc0995ec&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The storage metric namespace exposes Transactions and the subscription can enumerate action groups and alert-processing rules.&quot;,&quot;id&quot;:&quot;LAB23-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-04&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify metric, action-group, and processing-rule support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify metric, action-group, and processing-rule support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The storage target and disabled test notification receiver are run-owned, with no unsolicited message sent during setup.&quot;,&quot;id&quot;:&quot;LAB23-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-04&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the monitored target and action group, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the monitored target and action group&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The alert rule targets only the run-owned storage account, uses the intended aggregation/threshold, and references the exact action-group ID.&quot;,&quot;id&quot;:&quot;LAB23-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-04&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to create a scoped metric alert.&quot;,&quot;title&quot;:&quot;Create a scoped metric alert&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The processing rule is enabled only for the declared scope and schedule, without muting unrelated subscription alerts.&quot;,&quot;id&quot;:&quot;LAB23-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-04&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to apply a bounded alert-processing suppression rule, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Apply a bounded alert-processing suppression rule&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Alert criteria, target ID, action-group binding, and processing-rule scope all resolve to the run-owned resources.&quot;,&quot;id&quot;:&quot;LAB23-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-04&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile alert scope, criteria, actions, and suppression before handoff.&quot;,&quot;title&quot;:&quot;Reconcile alert scope, criteria, actions, and suppression&quot;}],&quot;title&quot;:&quot;Build Azure Monitor alerts, action groups, and processing rules&quot;}</metadata>

ID immediately, and add that exact object to the pilot group.&quot;,&quot;title&quot;:&quot;Invite and directly link the optional guest&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The impossible SKU is denied, usageLocation is uppercase and persisted, and exactly the approved subscribed SKU is assigned.&quot;,&quot;id&quot;:&quot;LAB02-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-USERS-05&quot;],&quot;purpose&quot;:&quot;Prove an invalid SKU is denied without mutation, normalize the guest&#x27;s two-letter usage location, validate exact capacity, and assign only the approved SKU.&quot;,&quot;title&quot;:&quot;Inject a license denial, then set usage location and assign the approved SKU&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The supported administrator property is true, exactly one prior Boolean is durable, and reconciliation explicitly reports that no selected-group scope endpoint was mutated.&quot;,&quot;id&quot;:&quot;LAB02-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-USERS-03&quot;,&quot;IG-USERS-04&quot;,&quot;IG-USERS-05&quot;],&quot;purpose&quot;:&quot;Persist allowedToUseSSPR before an exact-authorized PATCH, then reconcile policy, group, guest, license, and registration evidence without claiming selected-group SSPR configuration.&quot;,&quot;title&quot;:&quot;Record, exercise, and reconcile the supported administrator SSPR gate&quot;}],&quot;title&quot;:&quot;Manage Entra licenses, guests, and self-service password reset&quot;}</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-02">
  <title id="roadmap-title">LAB-02 learning roadmap: Manage Entra licenses, guests, and self-service password reset</title>
  <desc id="roadmap-desc">Manage Entra licenses, guests, and self-service password reset. Follow five checkpoints in lesson order. Task 1, LAB02-CP01: Inventory invitation policy, license capacity, and SSPR reporting access. Task 2, LAB02-CP02: Create and persist the required pilot group. Task 3, LAB02-CP03: Invite and directly link the optional guest. Task 4, LAB02-CP04: Inject a license denial, then set usage location and assign the approved SKU. Task 5, LAB02-CP05: Record, exercise, and reconcile the supported administrator SSPR gate. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>

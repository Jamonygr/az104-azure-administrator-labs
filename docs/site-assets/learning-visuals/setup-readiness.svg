<svg xmlns="http://www.w3.org/2000/svg" width="700" height="955" viewBox="0 0 700 955" role="img" aria-labelledby="title desc">
<title id="title">Task 5: interpret the blocking readiness report</title>
<desc id="desc">Check required tools, Azure CLI sign-in, Bicep, extensions, region, and lab prerequisites. Run Test-LabEnvironment.ps1 and inspect the ignored .state/readiness.json report. Every required check must pass. Resolve any named failure deliberately and rerun the readiness check.</desc>

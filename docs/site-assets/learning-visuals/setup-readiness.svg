ansform="translate(80 590) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9H63l18 18v64H19Z"/><path d="M63 9v20h18M32 47l7 7 13-15M58 48H69M32 69l7 7 13-15M58 70H69"/></g><text x="250" y="600" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Inspect every result</text><text x="250" y="643" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">.state/readiness.json</text><text x="250" y="677" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Keep the non-secret report</text><rect x="60" y="763" width="580" height="50" rx="25" fill="#122139" stroke="#7ee6b8" stroke-opacity=".42"/><text x="350" y="797" font-size="26" fill="#7ee6b8" text-anchor="middle" font-weight="650">All required checks must pass</text><text x="350" y="861" font-size="25" fill="#bac9e1" text-anchor="middle" font-weight="400">Required failure? Resolve the named</text><text x="350" y="897" font-size="25" fill="#bac9e1" text-anchor="middle" font-weight="400">prerequisite and rerun readiness.</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img" aria-labelledby="title desc">
<title id="title">Safe lab lifecycle from preview to residual audit</title>
<desc id="desc">The learning sequence is preview and preflight, explicit execution with required cost or tenant acknowledgements, independent readback and validation, scoped cleanup of manifest-owned targets, and a residual audit documenting active and retained items. Read-only labs make no Azure changes. Arrows show learning order, not Azure traffic.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#060c18"/><stop offset="1" stop-color="#0b182c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#68dcff"/></marker></defs>
<rect width="700" height="1180" rx="28" fill="url(#canvas)"/>
<rect x="16" y="16" width="668" height="1148" rx="22" fill="none" stroke="#294460" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="350" y="53" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">The safe run lifecycle</text><text x="350" y="92" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">Preview is the default for mutating commands</text><circle cx="125" cy="210" r="62" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 160) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="43" cy="42" r="28"/><path d="M64 64L88 88M29 41H56M29 31H45M29 51H49"/></g><text x="235" y="203" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Preview + preflight</text><text x="235" y="244" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Inspect context and inputs</text><path d="M125 276L125 327" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="395" r="62" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 345) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="39"/><path d="M41 29L72 50 41 71Z"/></g><text x="235" y="388" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Explicit execution</text><text x="235" y="429" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">-Execute + required</text><text x="235" y="460" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">acknowledgements</text><path d="M125 461L125 512" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="580" r="62" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 530) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="12" width="65" height="79" rx="7"/><path d="M32 31l5 5 9-11M53 31H70M32 52l5 5 9-11M53 52H70M32 73l5 5 9-11M53 73H70"/></g><text x="235" y="573" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Read back + validate</text><text x="235" y="614" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Check expected live state</text><path d="M125 646L125 697" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="765" r="62" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 715) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27H84M28 27V16h44v11M23 28l6 58h42l6-58M40 40v33M59 40v33"/><path d="M83 59l10 7v15q0 11-10 17-10-6-10-17V66Z"/></g><text x="235" y="758" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Owned cleanup</text><text x="235" y="799" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Exact manifest IDs only</text><path d="M125 831L125 882" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="950" r="62" fill="#101f36" stroke="#7ee6b8" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 900) scale(1)" fill="none" stroke="#7ee6b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9H63l18 18v64H19Z"/><path d="M63 9v20h18M32 47l7 7 13-15M58 48H69M32 69l7 7 13-15M58 70H69"/></g><text x="235" y="943" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Residual audit</text><text x="235" y="984" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Record active and retained items</text><text x="350" y="1093" font-size="24" fill="#bac9e1" text-anchor="middle" font-weight="400">Read-only labs make no Azure changes.</text><text x="350" y="1129" font-size="24" fill="#bac9e1" text-anchor="middle" font-weight="400">Follow the selected lab’s cost and tenant gates.</text></g>
</svg>

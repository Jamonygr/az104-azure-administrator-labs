<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-05">
  <title id="roadmap-title">LAB-05 learning roadmap: Enforce policy and manage costs with budgets and Advisor</title>
  <desc id="roadmap-desc">Enforce policy and manage costs with budgets and Advisor. Follow five checkpoints in lesson order. Task 1, LAB05-CP01: Resolve the built-in Policy and governance service prerequisites. Task 2, LAB05-CP02: Assign the built-in tag Policy at resource-group scope. Task 3, LAB05-CP03: Prove compliant creation and an intentionally denied request. Task 4, LAB05-CP04: Create an action group and resource-group budget notification. Task 5, LAB05-CP05: Correlate Policy compliance, budget state, and Advisor recommendations. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;identity-governance&quot;,&quot;labId&quot;:&quot;LAB-05&quot;,&quot;metadataSource&quot;:&quot;labs/05-policy-costs-advisor/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/05-policy-costs-advisor/README.md&quot;,&quot;sourceSha256&quot;:&quot;400908c64662adb19db755b0586e9a1f4e77a989b290793624796318aa60a17e&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;One built-in definition ID is resolved and every governance provider is already Registered without preflight mutation.&quot;,&quot;id&quot;:&quot;LAB05-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-01&quot;],&quot;purpose&quot;:&quot;Identify the immutable built-in definition ID and confirm Policy, Cost Management, Monitor, and Advisor providers before mutation.&quot;,&quot;title&quot;:&quot;Resolve the built-in Policy and governance service prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;One Default-enforcement assignment targets the exact resource group with tagName purpose and tagValue az104-lab.&quot;,&quot;id&quot;:&quot;LAB05-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-06&quot;],&quot;purpose&quot;:&quot;Create a manifest-recorded deny assignment requiring purpose=az104-lab on child resources.&quot;,&quot;title&quot;:&quot;Assign the built-in tag Policy at resource-group scope&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The tagged account exists and the untagged account request returns a Policy denial without creating a resource.&quot;,&quot;id&quot;:&quot;LAB05-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-07&quot;],&quot;purpose&quot;:&quot;Create one correctly tagged storage account and attempt a second untagged account under the deny assignment.&quot;,&quot;title&quot;:&quot;Prove compliant creation and an intentionally denied request&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The monthly 25-unit budget has an enabled actual-cost threshold at 80 percent and references the exact action-group ID.&quot;,&quot;id&quot;:&quot;LAB05-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-01&quot;],&quot;purpose&quot;:&quot;Wire an 80-percent monthly cost threshold to a manifest-owned action group, adding email only through the approved input gate.&quot;,&quot;title&quot;:&quot;Create an action group and resource-group budget notification&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Governance evidence distinguishes current compliant/non-compliant Policy state, configured budget notification, and zero or more contextual Advisor recommendations.&quot;,&quot;id&quot;:&quot;LAB05-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-01&quot;,&quot;IG-GOVERN-06&quot;,&quot;IG-GOVERN-07&quot;],&quot;purpose&quot;:&quot;Trigger a Policy scan, read current compliance and budget configuration, and inventory Advisor cost recommendations without auto-applying them.&quot;,&quot;title&quot;:&quot;Correlate Policy compliance, budget state, and Advisor recommendations&quot;}],&quot;title&quot;:&quot;Enforce policy and manage costs with budgets and Advisor&quot;}</metadata>

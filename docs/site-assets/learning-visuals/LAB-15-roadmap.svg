<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-15">
  <title id="roadmap-title">LAB-15 learning roadmap: Scale App Service and operate deployment slots</title>
  <desc id="roadmap-desc">Scale App Service and operate deployment slots. Follow five checkpoints in lesson order. Task 1, LAB15-CP01: Verify App Service plan and slot capacity. Task 2, LAB15-CP02: Create the production web app and deployment slot. Task 3, LAB15-CP03: Configure scale-out and slot-sticky settings. Task 4, LAB15-CP04: Swap staging into production with a recoverable path. Task 5, LAB15-CP05: Reconcile worker count, slot state, and configuration scope. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;compute&quot;,&quot;labId&quot;:&quot;LAB-15&quot;,&quot;metadataSource&quot;:&quot;labs/15-app-service-scale-slots/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/15-app-service-scale-slots/README.md&quot;,&quot;sourceSha256&quot;:&quot;b21b7a649cd1baab40206ffebb9da9e1fbd765194303e38c0f1253383cef38ab&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The selected region supports the documented Linux plan SKU and the subscription can enumerate web-app deployment slots.&quot;,&quot;id&quot;:&quot;LAB15-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;CP-APP-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify app service plan and slot capacity, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify App Service plan and slot capacity&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The production app and staging slot share the run-owned plan and each endpoint reports a healthy hostname.&quot;,&quot;id&quot;:&quot;LAB15-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;CP-APP-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the production web app and deployment slot, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the production web app and deployment slot&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The plan worker count matches the target and the designated application setting remains sticky to the slot.&quot;,&quot;id&quot;:&quot;LAB15-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;CP-APP-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to configure scale-out and slot-sticky settings.&quot;,&quot;title&quot;:&quot;Configure scale-out and slot-sticky settings&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The swap completes, both slots remain provisioned, and the sticky value stays with its intended slot.&quot;,&quot;id&quot;:&quot;LAB15-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;CP-APP-08&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to swap staging into production with a recoverable path, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Swap staging into production with a recoverable path&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Plan capacity, production/slot hostnames, and slotConfigNames prove the intended scaled release boundary.&quot;,&quot;id&quot;:&quot;LAB15-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;CP-APP-01&quot;,&quot;CP-APP-02&quot;,&quot;CP-APP-03&quot;,&quot;CP-APP-08&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile worker count, slot state, and configuration scope before handoff.&quot;,&quot;title&quot;:&quot;Reconcile worker count, slot state, and configuration scope&quot;}],&quot;title&quot;:&quot;Scale App Service and operate deployment slots&quot;}</metadata>

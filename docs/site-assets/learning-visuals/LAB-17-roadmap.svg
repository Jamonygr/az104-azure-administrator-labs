<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-17">
  <title id="roadmap-title">LAB-17 learning roadmap: Create VNets, subnets, peerings, and public IPs</title>
  <desc id="roadmap-desc">Create VNets, subnets, peerings, and public IPs. Follow five checkpoints in lesson order. Task 1, LAB17-CP01: Verify address-space and Standard public-IP regional support. Task 2, LAB17-CP02: Create two segmented virtual networks. Task 3, LAB17-CP03: Create reciprocal VNet peerings. Task 4, LAB17-CP04: Provision a Standard static public IP. Task 5, LAB17-CP05: Reconcile prefixes, peerings, and public exposure. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;networking&quot;,&quot;labId&quot;:&quot;LAB-17&quot;,&quot;metadataSource&quot;:&quot;labs/17-vnet-subnets-peering-public-ip/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/17-vnet-subnets-peering-public-ip/README.md&quot;,&quot;sourceSha256&quot;:&quot;7cd3c352c9ab4228a92bfd0b7a94a27349fb7246e8696cf7e7364c9ff6e32ca2&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;Both planned CIDRs are non-overlapping and the region offers the Standard static public-IP SKU.&quot;,&quot;id&quot;:&quot;LAB17-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;NW-VNET-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify address-space and standard public-ip regional support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify address-space and Standard public-IP regional support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;Each VNet contains its run-specific subnet and exposes the expected non-overlapping address prefix.&quot;,&quot;id&quot;:&quot;LAB17-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;NW-VNET-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create two segmented virtual networks, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create two segmented virtual networks&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;Both peering directions report Connected and use the intended access and forwarding settings.&quot;,&quot;id&quot;:&quot;LAB17-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;NW-VNET-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to create reciprocal vnet peerings.&quot;,&quot;title&quot;:&quot;Create reciprocal VNet peerings&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The public IP uses Standard SKU, static allocation, and a run-owned DNS label when one is supplied.&quot;,&quot;id&quot;:&quot;LAB17-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;NW-VNET-01&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to provision a standard static public ip, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Provision a Standard static public IP&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;VNet prefixes, subnet boundaries, reciprocal peerings, and the exact public-IP SKU/allocation all match the topology.&quot;,&quot;id&quot;:&quot;LAB17-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;NW-VNET-01&quot;,&quot;NW-VNET-02&quot;,&quot;NW-VNET-03&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile prefixes, peerings, and public exposure before handoff.&quot;,&quot;title&quot;:&quot;Reconcile prefixes, peerings, and public exposure&quot;}],&quot;title&quot;:&quot;Create VNets, subnets, peerings, and public IPs&quot;}</metadata>

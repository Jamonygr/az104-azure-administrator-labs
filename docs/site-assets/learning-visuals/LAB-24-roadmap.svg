<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1677" viewBox="0 0 640 1677" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-24">
  <title id="roadmap-title">LAB-24 learning roadmap: Configure Azure Backup policies, protection, restore, reports, and alerts</title>
  <desc id="roadmap-desc">Configure Azure Backup policies, protection, restore, reports, and alerts. Follow five checkpoints in lesson order. Task 1, LAB24-CP01: Verify Recovery Services and protected-VM prerequisites. Task 2, LAB24-CP02: Create the private VM, staging storage, and vault. Task 3, LAB24-CP03: Enable VM protection and complete an on-demand backup. Task 4, LAB24-CP04: Restore disks from the recorded recovery point. Task 5, LAB24-CP05: Reconcile protection, jobs, recovery points, and retained state. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;monitor-recovery&quot;,&quot;labId&quot;:&quot;LAB-24&quot;,&quot;metadataSource&quot;:&quot;labs/24-azure-backup-restore/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/24-azure-backup-restore/README.md&quot;,&quot;sourceSha256&quot;:&quot;5bb0d02c5f31f0e6e380a5df332f77f939b85ecbf6a1e9c291e3f78f134c6ec3&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The region supports the selected VM size and the Recovery Services provider is ready for vault and protection operations.&quot;,&quot;id&quot;:&quot;LAB24-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;MR-RECOVERY-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify recovery services and protected-vm prerequisites, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify Recovery Services and protected-VM prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The VM has no public IP and the vault, storage account, and VM IDs are persisted before protection is enabled.&quot;,&quot;id&quot;:&quot;LAB24-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;MR-RECOVERY-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the private vm, staging storage, and vault, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the private VM, staging storage, and vault&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The protected item resolves in the vault and the bounded backup job reaches Completed with a recovery point.&quot;,&quot;id&quot;:&quot;LAB24-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;MR-RECOVERY-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to enable vm protection and complete an on-demand backup.&quot;,&quot;title&quot;:&quot;Enable VM protection and complete an on-demand backup&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The restore job reaches Completed and produces a restore artifact in the designated staging account/resource group.&quot;,&quot;id&quot;:&quot;LAB24-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;MR-RECOVERY-04&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to restore disks from the recorded recovery point, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Restore disks from the recorded recovery point&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Protected-item status, completed backup/restore jobs, recovery-point identity, and soft-delete expectations are all explicit.&quot;,&quot;id&quot;:&quot;LAB24-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;MR-RECOVERY-01&quot;,&quot;MR-RECOVERY-02&quot;,&quot;MR-RECOVERY-03&quot;,&quot;MR-RECOVERY-04&quot;,&quot;MR-RECOVERY-07&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile protection, jobs, recovery points, and retained state before handoff.&quot;,&quot;title&quot;:&quot;Reconcile protection, jobs, recovery points, and retained state&quot;}],&quot;title&quot;:&quot;Configure Azure Backup policies, protection, restore, reports, and alerts&quot;}</metadata>

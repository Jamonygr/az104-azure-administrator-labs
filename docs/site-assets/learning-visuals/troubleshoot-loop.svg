<svg xmlns="http://www.w3.org/2000/svg" width="700" height="985" viewBox="0 0 700 985" role="img" aria-labelledby="title desc">
<title id="title">Troubleshooting loop: observe, diagnose, repair, and reverify</title>
<desc id="desc">Observe a failed check and retain redacted evidence. Diagnose one cause with read-only queries, apply a small repair, then repeat the same check and retain before and after evidence. If it still fails, return to diagnosis. Do not inject another fault before removing the first.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#060c18"/><stop offset="1" stop-color="#0b182c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#68dcff"/></marker></defs>
<rect width="700" height="985" rx="28" fill="url(#canvas)"/>
<rect x="16" y="16" width="668" height="953" rx="22" fill="none" stroke="#294460" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="350" y="53" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">Make the break/fix teach you</text><text x="350" y="92" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">One symptom, one cause, one verified repair</text><circle cx="125" cy="210" r="62" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 160) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9H63l18 18v64H19Z"/><path d="M63 9v20h18M32 47l7 7 13-15M58 48H69M32 69l7 7 13-15M58 70H69"/></g><text x="235" y="202" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Observe the failure</text><text x="235" y="244" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Retain redacted evidence</text><path d="M125 276L125 332" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="400" r="62" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 350) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="43" cy="42" r="28"/><path d="M64 64L88 88M29 41H56M29 31H45M29 51H49"/></g><text x="235" y="392" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Diagnose one cause</text><text x="235" y="434" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Compare read-only queries</text><path d="M125 466L125 522" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="590" r="62" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 540) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M63 12a24 24 0 0 0-29 29L12 64a13 13 0 0 0 19 19l22-23a24 24 0 0 0 30-28L67 47 52 32Z"/><circle cx="23" cy="73" r="3"/></g><text x="235" y="582" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Apply a small repair</text><text x="235" y="624" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Resolve one fault at a time</text><path d="M125 656L125 712" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="125" cy="780" r="62" fill="#101f36" stroke="#7ee6b8" stroke-opacity=".38" stroke-width="2"/><g transform="translate(75 730) scale(1)" fill="none" stroke="#7ee6b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="12" width="65" height="79" rx="7"/><path d="M32 31l5 5 9-11M53 31H70M32 52l5 5 9-11M53 52H70M32 73l5 5 9-11M53 73H70"/></g><text x="235" y="772" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Repeat the same check</text><text x="235" y="814" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Prove before + after state</text><path d="M602 785H652V212H596" fill="none" stroke="#b9a0ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="60" y="889" width="580" height="50" rx="25" fill="#122139" stroke="#b9a0ff" stroke-opacity=".42"/><text x="350" y="923" font-size="24" fill="#b9a0ff" text-anchor="middle" font-weight="650">Still failing? Observe and diagnose again</text></g>
</svg>

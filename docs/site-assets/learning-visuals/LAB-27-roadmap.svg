<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1677" viewBox="0 0 640 1677" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-27">
  <title id="roadmap-title">LAB-27 learning roadmap: Capstone — Operate, troubleshoot, back up, and recover an Azure workload</title>
  <desc id="roadmap-desc">Capstone — Operate, troubleshoot, back up, and recover an Azure workload. Follow five checkpoints in lesson order. Task 1, LAB27-CP01: Verify operations and recovery prerequisites. Task 2, LAB27-CP02: Create the private workload and telemetry foundation. Task 3, LAB27-CP03: Generate telemetry and configure an actionable alert. Task 4, LAB27-CP04: Inject and repair a deterministic NSG outage. Task 5, LAB27-CP05: Back up, restore, and reconcile operational evidence. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;capstone&quot;,&quot;labId&quot;:&quot;LAB-27&quot;,&quot;metadataSource&quot;:&quot;labs/27-capstone-operate-recover/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/27-capstone-operate-recover/README.md&quot;,&quot;sourceSha256&quot;:&quot;f0ddf8d03cfa576c9e18a2e52560e2bda0ca4291d53141ce1a74d5f469ee890f&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;VM, Network Watcher, Monitor, Storage, and Recovery Services capabilities are available for the selected region and SKU.&quot;,&quot;id&quot;:&quot;LAB27-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-03&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify operations and recovery prerequisites, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify operations and recovery prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The private VM, storage account, workspace, vault, and network-security boundary are recorded immediately after creation.&quot;,&quot;id&quot;:&quot;LAB27-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-01&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the private workload and telemetry foundation, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the private workload and telemetry foundation&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;A deterministic storage transaction is routed to the workspace and the metric alert scopes the exact storage resource.&quot;,&quot;id&quot;:&quot;LAB27-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-02&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to generate telemetry and configure an actionable alert.&quot;,&quot;title&quot;:&quot;Generate telemetry and configure an actionable alert&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The deny rule produces the documented effective-security symptom, diagnosis identifies its priority, and repair restores the prior path.&quot;,&quot;id&quot;:&quot;LAB27-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-04&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to inject and repair a deterministic nsg outage, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Inject and repair a deterministic NSG outage&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The backup and disk-restore jobs complete, telemetry remains queryable, effective networking is healthy, and cleanup honors soft-delete retention.&quot;,&quot;id&quot;:&quot;LAB27-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-03&quot;,&quot;IG-GOVERN-01&quot;,&quot;IG-GOVERN-02&quot;,&quot;IG-GOVERN-04&quot;,&quot;IG-GOVERN-06&quot;,&quot;NW-VNET-05&quot;,&quot;NW-SECURE-02&quot;,&quot;NW-DNSLB-03&quot;,&quot;MR-MONITOR-03&quot;,&quot;MR-MONITOR-04&quot;,&quot;MR-MONITOR-05&quot;,&quot;MR-MONITOR-06&quot;,&quot;MR-RECOVERY-04&quot;,&quot;MR-RECOVERY-06&quot;,&quot;MR-RECOVERY-07&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to back up, restore, and reconcile operational evidence before handoff.&quot;,&quot;title&quot;:&quot;Back up, restore, and reconcile operational evidence&quot;}],&quot;title&quot;:&quot;Capstone — Operate, troubleshoot, back up, and recover an Azure workload&quot;}</metadata>

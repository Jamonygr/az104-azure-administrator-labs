<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-07">
  <title id="roadmap-title">LAB-07 learning roadmap: Restrict storage networking and issue scoped SAS access</title>
  <desc id="roadmap-desc">Restrict storage networking and issue scoped SAS access. Follow five checkpoints in lesson order. Task 1, LAB07-CP01: Establish the network and authorization test model. Task 2, LAB07-CP02: Build the service-endpoint subnet and private container. Task 3, LAB07-CP03: Generate a short-lived service SAS from the stored policy. Task 4, LAB07-CP04: Prove that a valid SAS is denied from an unapproved network. Task 5, LAB07-CP05: Repair a removed subnet rule and revoke the stored policy. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;storage&quot;,&quot;labId&quot;:&quot;LAB-07&quot;,&quot;metadataSource&quot;:&quot;labs/07-storage-network-sas/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/07-storage-network-sas/README.md&quot;,&quot;sourceSha256&quot;:&quot;99dbf3d9a85624beeda0666cf68bd44242aaa2e1f1e4563191104983e9403ff7&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;Storage is registered and the plan contains one non-overlapping subnet and a default-deny target.&quot;,&quot;id&quot;:&quot;LAB07-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-01&quot;],&quot;purpose&quot;:&quot;Confirm the provider and deterministic address space, and distinguish firewall origin checks from SAS permissions.&quot;,&quot;title&quot;:&quot;Establish the network and authorization test model&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The subnet exposes Microsoft.Storage, the account is default-deny with one VNet rule, and the private container has one stored access policy.&quot;,&quot;id&quot;:&quot;LAB07-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-02&quot;],&quot;purpose&quot;:&quot;Create the account temporarily open for bootstrap, create the container and stored access policy, then close the firewall to one subnet.&quot;,&quot;title&quot;:&quot;Build the service-endpoint subnet and private container&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;A non-empty service SAS references policy az104 and is cleared without entering command output, state, or evidence.&quot;,&quot;id&quot;:&quot;LAB07-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-03&quot;],&quot;purpose&quot;:&quot;Sign a container SAS in memory, confirm its bounded lifetime and policy reference, and persist neither the key nor token.&quot;,&quot;title&quot;:&quot;Generate a short-lived service SAS from the stored policy&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;SAS signing succeeds locally, the data-plane request fails from the unapproved origin, and no token is retained.&quot;,&quot;id&quot;:&quot;LAB07-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-04&quot;],&quot;purpose&quot;:&quot;Use a freshly signed policy-bound SAS from the learner workstation and require the data-plane request to fail while the firewall is Deny.&quot;,&quot;title&quot;:&quot;Prove that a valid SAS is denied from an unapproved network&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The exact subnet rule is restored, defaultAction is Deny, and policy az104 is revoked before cleanup.&quot;,&quot;id&quot;:&quot;LAB07-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-01&quot;,&quot;ST-ACCESS-02&quot;,&quot;ST-ACCESS-03&quot;,&quot;ST-ACCESS-04&quot;],&quot;purpose&quot;:&quot;Remove and restore the exact VNet rule as a deterministic fault, then revoke future SAS use through the stored access policy.&quot;,&quot;title&quot;:&quot;Repair a removed subnet rule and revoke the stored policy&quot;}],&quot;title&quot;:&quot;Restrict storage networking and issue scoped SAS access&quot;}</metadata>

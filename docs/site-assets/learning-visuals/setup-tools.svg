<svg xmlns="http://www.w3.org/2000/svg" width="700" height="935" viewBox="0 0 700 935" role="img" aria-labelledby="title desc">
<title id="title">Task 1: inspect the local toolchain</title>
<desc id="desc">Six original tool pictograms represent PowerShell, Azure CLI, Bicep, AzCopy, Python, and Node. Read their versions from the intended PATH; version discovery does not install tools or deploy Azure resources.</desc>

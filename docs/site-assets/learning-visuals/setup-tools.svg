circle cx="510" cy="445" r="65" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(460 395) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 33H77l-13-13M77 33L64 46M88 67H23l13 13M23 67l13-13"/><rect x="8" y="15" width="18" height="17" rx="3"/><rect x="74" y="68" width="18" height="17" rx="3"/></g><text x="510" y="549" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">AzCopy</text><text x="510" y="585" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">azcopy --version</text><circle cx="190" cy="670" r="65" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(140 620) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 50V31q0-14 16-14h24q16 0 16 15v18H44q-12 0-12 11v16H21q-13 0-13-15v-3q0-9 14-9ZM78 50v19q0 14-16 14H38q-16 0-16-15V50h34q12 0 12-11V23h11q13 0 13 15v3q0 9-14 9Z"/><circle cx="42" cy="28" r="2"/><circle cx="58" cy="72" r="2"/></g><text x="190" y="774" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Python</text><text x="190" y="810" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">python --version</text><circle cx="510" cy="670" r="65" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(460 620) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 8L87 29v42L50 92 13 71V29Z"/><path d="M33 68V32l34 36V32"/></g><text x="510" y="774" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Node</text><text x="510" y="810" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">node --version</text><rect x="60" y="852" width="580" height="50" rx="25" fill="#122139" stroke="#68dcff" stroke-opacity=".42"/><text x="350" y="886" font-size="2
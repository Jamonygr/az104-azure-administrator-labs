<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-11">
  <title id="roadmap-title">LAB-11 learning roadmap: Manage VM lifecycle, size, disks, and host encryption</title>
  <desc id="roadmap-desc">Manage VM lifecycle, size, disks, and host encryption. Follow five checkpoints in lesson order. Task 1, LAB11-CP01: Verify VM SKU and encryption-at-host capability. Task 2, LAB11-CP02: Create the private-NIC VM with encryption at host. Task 3, LAB11-CP03: Attach and verify the managed data disk. Task 4, LAB11-CP04: Resize the VM through a deallocated transition. Task 5, LAB11-CP05: Reconcile VM size, disks, host encryption, and private exposure. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;compute&quot;,&quot;labId&quot;:&quot;LAB-11&quot;,&quot;metadataSource&quot;:&quot;labs/11-vm-lifecycle-disks-encryption/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/11-vm-lifecycle-disks-encryption/README.md&quot;,&quot;sourceSha256&quot;:&quot;6a0900c46e9f80643ef15e12dca39e581053e716eed3b996e4b2d2e873eefc1a&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;Standard_B1s is unrestricted in the selected region and its capability inventory explicitly supports EncryptionAtHost.&quot;,&quot;id&quot;:&quot;LAB11-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;CP-VM-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify vm sku and encryption-at-host capability, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify VM SKU and encryption-at-host capability&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The VM has no public IP, uses the selected SKU, and securityProfile.encryptionAtHost is true.&quot;,&quot;id&quot;:&quot;LAB11-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;CP-VM-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the private-nic vm with encryption at host, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the private-NIC VM with encryption at host&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The managed disk is attached at the declared LUN and reports a Succeeded provisioning state.&quot;,&quot;id&quot;:&quot;LAB11-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;CP-VM-04&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to attach and verify the managed data disk.&quot;,&quot;title&quot;:&quot;Attach and verify the managed data disk&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The VM is restarted on the target size only after deallocation, and the instance view reports a running power state.&quot;,&quot;id&quot;:&quot;LAB11-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;CP-VM-05&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to resize the vm through a deallocated transition, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Resize the VM through a deallocated transition&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The VM model simultaneously proves the target hardware profile, attached disk, encryptionAtHost=true, and no public-IP association.&quot;,&quot;id&quot;:&quot;LAB11-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;CP-VM-01&quot;,&quot;CP-VM-02&quot;,&quot;CP-VM-04&quot;,&quot;CP-VM-05&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile vm size, disks, host encryption, and private exposure before handoff.&quot;,&quot;title&quot;:&quot;Reconcile VM size, disks, host encryption, and private exposure&quot;}],&quot;title&quot;:&quot;Manage VM lifecycle, size, disks, and host encryption&quot;}</metadata>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-14">
  <title id="roadmap-title">LAB-14 learning roadmap: Deploy and scale Azure Container Apps</title>
  <desc id="roadmap-desc">Deploy and scale Azure Container Apps. Follow five checkpoints in lesson order. Task 1, LAB14-CP01: Verify Container Apps extension and regional environment support. Task 2, LAB14-CP02: Create the managed environment and ingress application. Task 3, LAB14-CP03: Create a second revision without replacing the first. Task 4, LAB14-CP04: Split traffic between healthy revisions. Task 5, LAB14-CP05: Reconcile ingress, scaling, revisions, and traffic. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;compute&quot;,&quot;labId&quot;:&quot;LAB-14&quot;,&quot;metadataSource&quot;:&quot;labs/14-container-apps/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/14-container-apps/README.md&quot;,&quot;sourceSha256&quot;:&quot;23ce802cf2b74426ce6964ce6bfff74b2548195856a9760d0a4a7c5b0799ddbe&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The containerapp command group responds and the selected region offers a managed-environment location.&quot;,&quot;id&quot;:&quot;LAB14-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;CP-CONTAINERS-03&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify container apps extension and regional environment support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify Container Apps extension and regional environment support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The environment and app are provisioned, external ingress targets the declared port, and the first revision is healthy.&quot;,&quot;id&quot;:&quot;LAB14-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;CP-CONTAINERS-04&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the managed environment and ingress application, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the managed environment and ingress application&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;Multiple-revision mode retains both revisions and the new image produces a separately addressable revision.&quot;,&quot;id&quot;:&quot;LAB14-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;CP-CONTAINERS-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to create a second revision without replacing the first.&quot;,&quot;title&quot;:&quot;Create a second revision without replacing the first&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;Traffic weights total 100 and are assigned only to the two run-owned active revisions.&quot;,&quot;id&quot;:&quot;LAB14-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;CP-CONTAINERS-04&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to split traffic between healthy revisions, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Split traffic between healthy revisions&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Ingress FQDN, replica bounds, active revision health, and traffic percentages agree with the intended release model.&quot;,&quot;id&quot;:&quot;LAB14-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;CP-CONTAINERS-03&quot;,&quot;CP-CONTAINERS-04&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile ingress, scaling, revisions, and traffic before handoff.&quot;,&quot;title&quot;:&quot;Reconcile ingress, scaling, revisions, and traffic&quot;}],&quot;title&quot;:&quot;Deploy and scale Azure Container Apps&quot;}</metadata>

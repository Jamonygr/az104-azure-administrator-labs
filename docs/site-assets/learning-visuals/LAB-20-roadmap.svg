<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-20">
  <title id="roadmap-title">LAB-20 learning roadmap: Configure Azure DNS and secure administration with Bastion</title>
  <desc id="roadmap-desc">Configure Azure DNS and secure administration with Bastion. Follow five checkpoints in lesson order. Task 1, LAB20-CP01: Verify DNS-zone authority and Bastion regional support. Task 2, LAB20-CP02: Create the VNet, AzureBastionSubnet, and DNS zone. Task 3, LAB20-CP03: Publish and resolve run-owned DNS records. Task 4, LAB20-CP04: Delegate the run-owned child zone from a verified Azure DNS parent. Task 5, LAB20-CP05: Reconcile DNS authority, records, and secure administration. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;networking&quot;,&quot;labId&quot;:&quot;LAB-20&quot;,&quot;metadataSource&quot;:&quot;labs/20-azure-dns-bastion/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/20-azure-dns-bastion/README.md&quot;,&quot;sourceSha256&quot;:&quot;40cd4ce0e7d9e966564bc65804edb4badace0f18bc40e762ddaab8a286772507&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The region supports Azure Bastion and the DNS exercise uses either example.invalid or an explicitly owned parent-zone gate.&quot;,&quot;id&quot;:&quot;LAB20-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;NW-SECURE-03&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify dns-zone authority and bastion regional support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify DNS-zone authority and Bastion regional support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The Bastion subnet uses the required name and prefix, while the run-owned DNS zone exposes authoritative name servers.&quot;,&quot;id&quot;:&quot;LAB20-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;NW-DNSLB-01&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the VNet, AzureBastionSubnet, and DNS zone, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the VNet, AzureBastionSubnet, and DNS zone&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The A and CNAME records return the documented values and no record is added to an unverified parent zone.&quot;,&quot;id&quot;:&quot;LAB20-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;NW-SECURE-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to publish and resolve run-owned dns records.&quot;,&quot;title&quot;:&quot;Publish and resolve run-owned DNS records&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The optional parent NS record contains exactly the child zone&#x27;s authoritative name servers and its exact returned ID is recorded for cleanup.&quot;,&quot;id&quot;:&quot;LAB20-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;NW-DNSLB-01&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to delegate the run-owned child zone from a verified azure dns parent, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Delegate the run-owned child zone from a verified Azure DNS parent&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Zone name servers, record answers, Bastion provisioning state, and subnet/public-IP placement match the intended topology.&quot;,&quot;id&quot;:&quot;LAB20-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;NW-SECURE-03&quot;,&quot;NW-DNSLB-01&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile dns authority, records, and secure administration before handoff.&quot;,&quot;title&quot;:&quot;Reconcile DNS authority, records, and secure administration&quot;}],&quot;title&quot;:&quot;Configure Azure DNS and secure administration with Bastion&quot;}</metadata>

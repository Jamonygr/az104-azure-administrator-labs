<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1677" viewBox="0 0 640 1677" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-08">
  <title id="roadmap-title">LAB-08 learning roadmap: Manage Blob lifecycle, tiers, versioning, replication, and AzCopy</title>
  <desc id="roadmap-desc">Manage Blob lifecycle, tiers, versioning, replication, and AzCopy. Follow five checkpoints in lesson order. Task 1, LAB08-CP01: Confirm AzCopy, identity, and object-replication prerequisites. Task 2, LAB08-CP02: Create and protect the source and destination accounts. Task 3, LAB08-CP03: Inject the missing-versioning fault and build both policy copies. Task 4, LAB08-CP04: Transfer and version a blob with AzCopy using the Azure CLI token. Task 5, LAB08-CP05: Reconcile protection, policy, versions, and asynchronous replication state. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;storage&quot;,&quot;labId&quot;:&quot;LAB-08&quot;,&quot;metadataSource&quot;:&quot;labs/08-blob-lifecycle-replication/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/08-blob-lifecycle-replication/README.md&quot;,&quot;sourceSha256&quot;:&quot;189238aa453dddf53e331f45a6e80285bb82e8dd0a214128aa6bbc71cbe593c3&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;AzCopy v10 and an interactive learner object ID are available before any storage account is created.&quot;,&quot;id&quot;:&quot;LAB08-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-03&quot;],&quot;purpose&quot;:&quot;Validate the local transfer tool, signed-in user, provider, and unique account names before creating endpoints.&quot;,&quot;title&quot;:&quot;Confirm AzCopy, identity, and object-replication prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;Both accounts have change feed and soft delete; source versioning is on, destination versioning is intentionally off for the next break/fix, and lifecycle manages base blobs and versions.&quot;,&quot;id&quot;:&quot;LAB08-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-05&quot;],&quot;purpose&quot;:&quot;Persist each account immediately, configure soft delete and change feed, assign data roles, and install the source lifecycle rule.&quot;,&quot;title&quot;:&quot;Create and protect the source and destination accounts&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The pre-repair attempt fails, destination versioning becomes true, and the same policy ID with one rule exists on both accounts.&quot;,&quot;id&quot;:&quot;LAB08-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;ST-DATA-02&quot;],&quot;purpose&quot;:&quot;Require replication creation to fail while destination versioning is off, repair the prerequisite, then apply the destination-generated policy to both endpoints.&quot;,&quot;title&quot;:&quot;Inject the missing-versioning fault and build both policy copies&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The source has a current Cool blob plus at least one prior version; eligible versions begin asynchronous replication to destination.&quot;,&quot;id&quot;:&quot;LAB08-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;ST-DATA-03&quot;],&quot;purpose&quot;:&quot;Use AZCLI auto-login, upload two revisions, and place the current version in Cool tier without SAS or account keys.&quot;,&quot;title&quot;:&quot;Transfer and version a blob with AzCopy using the Azure CLI token&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Both policy copies match, the lifecycle rule and source versions exist, and destination-copy count is reported as an observation rather than a synchronous pass gate.&quot;,&quot;id&quot;:&quot;LAB08-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-03&quot;,&quot;ST-ACCOUNTS-05&quot;,&quot;ST-DATA-02&quot;,&quot;ST-DATA-03&quot;,&quot;ST-DATA-04&quot;,&quot;ST-DATA-06&quot;,&quot;ST-DATA-07&quot;],&quot;purpose&quot;:&quot;Prove the lifecycle rule, recovery controls, two policy copies, source revisions, and observable replication status without pretending asynchronous convergence is immediate.&quot;,&quot;title&quot;:&quot;Reconcile protection, policy, versions, and asynchronous replication state&quot;}],&quot;title&quot;:&quot;Manage Blob lifecycle, tiers, versioning, replication, and AzCopy&quot;}</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="910" viewBox="0 0 700 910" role="img" aria-labelledby="title desc">
<title id="title">Task 3: establish a run ownership boundary</title>
<desc id="desc">A unique lowercase run ID determines names and ownership tags. The ignored local .state/run-id/run.json manifest must already exist and match the lab ID and run ID. Tags identify purpose, labId, and runId. The manifest is a local ownership record, not an Azure deployment.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#060c18"/><stop offset="1" stop-color="#0b182c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#68dcff"/></marker></defs>
<rect width="700" height="910" rx="28" fill="url(#canvas)"/>
<rect x="16" y="16" width="668" height="878" rx="22" fill="none" stroke="#294460" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="350" y="53" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">Give this run a safe boundary</text><text x="350" y="92" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">Task 3 · names, tags, and an ignored manifest</text><circle cx="180" cy="235" r="65" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(130 185) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 45L44 9h40v40L48 85Z"/><circle cx="68" cy="25" r="5"/><path d="M31 47l17 17M42 36l17 17"/></g><text x="180" y="335" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Unique run ID</text><text x="180" y="371" font-size="21" fill="#bac9e1" text-anchor="middle" font-weight="400">Lowercase + never reused</text><circle cx="520" cy="235" r="65" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(470 185) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="12" width="80" height="23" rx="5"/><rect x="10" y="42" width="80" height="23" rx="5"/><rect x="10" y="72" width="80" height="16" rx="5"/><path d="M21 24H58M21 54H72M21 80H48"/></g><text x="520" y="335" font-size="26" fill="#ecf4ff" text-anchor="middle" font-weight="650">Deterministic names</text><text x="520" y="371" font-size="21" fill="#bac9e1" text-anchor="middle" font-weight="400">Predictable per-run names</text><path d="M180 391V432H350M520 391V432H350" fill="none" stroke="#68dcff" stroke-width="3"/><path d="M350 432L350 474" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="350" cy="545" r="70" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(300 495) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9H61l20 20v62H24Z"/><path d="M61 9v21h20M36 44H67M36 57H67M36 70H56"/></g><text x="350" y="654" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">run.json</text><text x="350" y="692" font-size="26" fill="#bac9e1" text-anchor="middle" font-weight="400">.state/&lt;run-id&gt;/run.json</text><text x="350" y="739" font-size="27" fill="#68dcff" text-anchor="middle" font-weight="650">Match lab ID + run ID exactly</text><rect x="60" y="779" width="580" height="50" rx="25" fill="#122139" stroke="#b9a0ff" stroke-opacity=".42"/><text x="350" y="813" font-size="24" fill="#b9a0ff" text-anchor="middle" font-weight="650">Ownership tags: purpose · labId · runId</text><text x="350" y="870" font-size="25" fill="#bac9e1" text-anchor="middle" font-weight="400">Ignored local state · keep credentials out</text></g>

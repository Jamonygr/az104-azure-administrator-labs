<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1607" viewBox="0 0 640 1607" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-00">
  <title id="roadmap-title">LAB-00 learning roadmap: Safe Azure lab bootstrap</title>
  <desc id="roadmap-desc">Safe Azure lab bootstrap. Follow five checkpoints in lesson order. Task 1, LAB00-CP01: Confirm the local Azure CLI, PowerShell, Bicep, AzCopy, Python, and Node toolchain. Task 2, LAB00-CP02: Sign in deliberately and confirm tenant, subscription, and cloud context. Task 3, LAB00-CP03: Create a safe run ID, deterministic names, tags, and a local state boundary. Task 4, LAB00-CP04: Preview cost gates, ownership checks, cleanup, and residual queries. Task 5, LAB00-CP05: Run the blocking readiness report and interpret every result. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;foundation&quot;,&quot;labId&quot;:&quot;LAB-00&quot;,&quot;metadataSource&quot;:&quot;labs/00-safe-bootstrap/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/00-safe-bootstrap/README.md&quot;,&quot;sourceSha256&quot;:&quot;3bcd8ac03059c2e24b97841f943eb7dd4c166dcf1c555db02cac60a22db0b0ce&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;PowerShell, Azure CLI, Bicep through Azure CLI, AzCopy, Python, and Node all return versions from the intended PATH.&quot;,&quot;id&quot;:&quot;LAB00-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;FD-TOOLS-01&quot;],&quot;purpose&quot;:&quot;Inventory every executable used by later labs and record its version without installing or changing software.&quot;,&quot;title&quot;:&quot;Confirm the local Azure CLI, PowerShell, Bicep, AzCopy, Python, and Node toolchain&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;Exactly one active default context matches the supplied subscription and reports AzureCloud.&quot;,&quot;id&quot;:&quot;LAB00-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;FD-CONTEXT-01&quot;],&quot;purpose&quot;:&quot;Compare the active Azure CLI context with the explicitly supplied sandbox subscription before any later mutation.&quot;,&quot;title&quot;:&quot;Sign in deliberately and confirm tenant, subscription, and cloud context&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The name and tags contain the run ID, and `.state/&lt;run-id&gt;/run.json` already exists outside version control.&quot;,&quot;id&quot;:&quot;LAB00-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;FD-SAFETY-01&quot;],&quot;purpose&quot;:&quot;Derive predictable names and ownership tags, then verify that the ignored manifest uniquely identifies this run.&quot;,&quot;title&quot;:&quot;Create a safe run ID, deterministic names, tags, and a local state boundary&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The region exists, required providers are observable, and no Azure resource is falsely claimed by this non-mutating bootstrap run.&quot;,&quot;id&quot;:&quot;LAB00-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;FD-COST-01&quot;,&quot;FD-CLEANUP-01&quot;],&quot;purpose&quot;:&quot;Verify region and provider readiness, inventory any matching lab resources, and review the exact residual query before deployment.&quot;,&quot;title&quot;:&quot;Preview cost gates, ownership checks, cleanup, and residual queries&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Every required tool, Azure CLI sign-in, Bicep, extension, region, and Lab 00 prerequisite check passes.&quot;,&quot;id&quot;:&quot;LAB00-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;FD-TOOLS-01&quot;,&quot;FD-CONTEXT-01&quot;,&quot;FD-COST-01&quot;,&quot;FD-SAFETY-01&quot;,&quot;FD-CLEANUP-01&quot;],&quot;purpose&quot;:&quot;Run the repository readiness contract as one command and investigate any required check that does not pass.&quot;,&quot;title&quot;:&quot;Run the blocking readiness report and interpret every result&quot;}],&quot;title&quot;:&quot;Safe Azure lab bootstrap&quot;}</metadata>

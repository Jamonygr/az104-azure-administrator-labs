<svg xmlns="http://www.w3.org/2000/svg" width="700" height="990" viewBox="0 0 700 990" role="img" aria-labelledby="title desc">
<title id="title">Task 2: deliberately confirm Azure context</title>
<desc id="desc">Sign in deliberately, read the cached Azure CLI cloud, tenant, and subscription, and compare the active context with the intended sandbox. A match allows readiness checks to continue; a mismatch stops before mutation. Select the approved context yourself and recheck.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#060c18"/><stop offset="1" stop-color="#0b182c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#68dcff"/></marker></defs>
<rect width="700" height="990" rx="28" fill="url(#canvas)"/>
<rect x="16" y="16" width="668" height="958" rx="22" fill="none" stroke="#294460" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="350" y="53" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">Know which Azure context</text><text x="350" y="92" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">your commands will use</text><text x="350" y="131" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">Task 2 · inspect before any change</text><circle cx="130" cy="220" r="65" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(80 170) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="30" r="16"/><path d="M17 84v-9q0-23 33-23t33 23v9Z"/></g><text x="250" y="211" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Sign in deliberately</text><text x="250" y="249" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">az login</text><path d="M130 288L130 342" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="410" r="65" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(80 360) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="86" height="66" rx="9"/><path d="M31 18V10h38v8M58 39H80M58 52H80M58 65H72"/><circle cx="31" cy="42" r="10"/><path d="M16 71v-4q0-12 15-12t15 12v4"/></g><text x="250" y="377" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Inspect cached context</text><text x="250" y="417" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">az account show</text><text x="250" y="449" font-size="22" fill="#bac9e1" text-anchor="start" font-weight="400">Cloud · tenant · subscription</text><path d="M130 478L130 532" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="600" r="65" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(80 550) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 7L85 20v29q0 27-35 44Q15 76 15 49V20Z"/><path d="M31 49l13 13 26-29"/></g><text x="250" y="565" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Compare the intended</text><text x="250" y="601" font-size="28" fill="#ecf4ff" text-anchor="start" font-weight="650">Azure context</text><text x="250" y="646" font-size="21" fill="#bac9e1" text-anchor="start" font-weight="400">AzureCloud + approved subscription</text><path d="M130 670V721H510" fill="none" stroke="#68dcff" stroke-width="3"/><path d="M190 721L190 765" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 721L510 765" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="190" cy="818" r="50" fill="#101f36" stroke="#7ee6b8" stroke-opacity=".38" stroke-width="2"/><g transform="translate(140 768) scale(1)" fill="none" stroke="#7ee6b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 7L85 20v29q0 27-35 44Q15 76 15 49V20Z"/><path d="M31 49l13 13 26-29"/></g><circle cx="510" cy="818" r="50" fill="#101f36" stroke="#ff9cac" stroke-opacity=".38" stroke-width="2"/><g transform="translate(460 768) scale(1)" fill="none" stroke="#ff9cac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M29 10H71l19 19v42L71 90H29L10 71V29Z"/><path d="M33 33l34 34M67 33L33 67"/></g><text x="190" y="900" font-size="26" fill="#7ee6b8" text-anchor="middle" font-weight="650">Match: continue</text><text x="510" y="900" font-size="26" fill="#ff9cac" text-anchor="middle" font-weight="650">Mismatch: stop</text><text x="350" y="950" font-size="23" fill="#bac9e1" text-anchor="middle" font-weight="400">Select the approved context yourself, then recheck.</text></g>
</svg>

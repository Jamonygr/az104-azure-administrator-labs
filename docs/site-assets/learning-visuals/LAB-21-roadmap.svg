<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-21">
  <title id="roadmap-title">LAB-21 learning roadmap: Load balance workloads and troubleshoot with Network Watcher</title>
  <desc id="roadmap-desc">Load balance workloads and troubleshoot with Network Watcher. Follow five checkpoints in lesson order. Task 1, LAB21-CP01: Verify load-balancer and Network Watcher diagnostics support. Task 2, LAB21-CP02: Create two private backends behind a Standard load balancer. Task 3, LAB21-CP03: Configure health probing and balanced traffic. Task 4, LAB21-CP04: Run topology-compatible Network Watcher diagnostics. Task 5, LAB21-CP05: Reconcile frontend, backend health, and diagnostic evidence. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;networking&quot;,&quot;labId&quot;:&quot;LAB-21&quot;,&quot;metadataSource&quot;:&quot;labs/21-load-balancer-network-watcher/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/21-load-balancer-network-watcher/README.md&quot;,&quot;sourceSha256&quot;:&quot;bd5029ec117b684324aaf76bf059d3f567518289e74dac1f094ea7473f82c7f5&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The Standard load-balancer SKU and Network Watcher diagnostic commands are available in the selected region.&quot;,&quot;id&quot;:&quot;LAB21-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;NW-VNET-05&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify load-balancer and network watcher diagnostics support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify load-balancer and Network Watcher diagnostics support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;Both backend NICs join the pool and the frontend, health probe, and rule reference one consistent load-balancer resource.&quot;,&quot;id&quot;:&quot;LAB21-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;NW-DNSLB-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create two private backends behind a standard load balancer, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create two private backends behind a Standard load balancer&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The TCP probe and load-balancing rule share the intended ports, backend pool, and idle-timeout behavior.&quot;,&quot;id&quot;:&quot;LAB21-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;NW-DNSLB-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to configure health probing and balanced traffic.&quot;,&quot;title&quot;:&quot;Configure health probing and balanced traffic&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;IP-flow, next-hop, or connection-troubleshoot evidence identifies the effective network decision without relying on an unavailable public path.&quot;,&quot;id&quot;:&quot;LAB21-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-06&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to run topology-compatible network watcher diagnostics, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Run topology-compatible Network Watcher diagnostics&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Frontend configuration, backend membership, probe/rule bindings, and diagnostic results all refer to the same run-owned traffic path.&quot;,&quot;id&quot;:&quot;LAB21-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;NW-VNET-05&quot;,&quot;NW-DNSLB-02&quot;,&quot;NW-DNSLB-03&quot;,&quot;MR-MONITOR-06&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile frontend, backend health, and diagnostic evidence before handoff.&quot;,&quot;title&quot;:&quot;Reconcile frontend, backend health, and diagnostic evidence&quot;}],&quot;title&quot;:&quot;Load balance workloads and troubleshoot with Network Watcher&quot;}</metadata>

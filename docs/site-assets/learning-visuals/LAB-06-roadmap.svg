<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-06">
  <title id="roadmap-title">LAB-06 learning roadmap: Secure storage accounts, redundancy, encryption, and keys</title>
  <desc id="roadmap-desc">Secure storage accounts, redundancy, encryption, and keys. Follow five checkpoints in lesson order. Task 1, LAB06-CP01: Select supported redundancy from regional SKU restrictions. Task 2, LAB06-CP02: Create the hardened account with the selected redundancy. Task 3, LAB06-CP03: Authorize and exercise identity-based blob access. Task 4, LAB06-CP04: Prove that Shared Key authorization is denied. Task 5, LAB06-CP05: Rotate the secondary key and reconcile the hardened account. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;storage&quot;,&quot;labId&quot;:&quot;LAB-06&quot;,&quot;metadataSource&quot;:&quot;labs/06-storage-accounts-security/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/06-storage-accounts-security/README.md&quot;,&quot;sourceSha256&quot;:&quot;b3427e4b5e34e812b16729439fbe39a47a7428a25583ed4dda00e32b78d548d5&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;selected-redundancy is Standard_ZRS when unrestricted, otherwise Standard_LRS with fallbackUsed true.&quot;,&quot;id&quot;:&quot;LAB06-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-04&quot;],&quot;purpose&quot;:&quot;Query the Storage resource provider and choose ZRS only when the subscription and region permit it.&quot;,&quot;title&quot;:&quot;Select supported redundancy from regional SKU restrictions&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The account uses the persisted SKU, TLS1_2, HTTPS only, infrastructure encryption, no public blobs, no Shared Key, and a system identity.&quot;,&quot;id&quot;:&quot;LAB06-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-01&quot;],&quot;purpose&quot;:&quot;Apply infrastructure encryption, TLS, HTTPS-only transport, public-access denial, Shared Key denial, and managed identity at creation.&quot;,&quot;title&quot;:&quot;Create the hardened account with the selected redundancy&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The learner has one account-scoped blob data role and the private blob was written with login auth into the infrastructure-encrypted scope.&quot;,&quot;id&quot;:&quot;LAB06-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-02&quot;],&quot;purpose&quot;:&quot;Assign Storage Blob Data Contributor to the signed-in learner, create an encryption scope and private container, and upload through OAuth.&quot;,&quot;title&quot;:&quot;Authorize and exercise identity-based blob access&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The key-signed container listing fails, no key appears in output or state, and the OAuth blob query remains successful.&quot;,&quot;id&quot;:&quot;LAB06-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-04&quot;],&quot;purpose&quot;:&quot;Keep one account key only in memory, attempt a key-signed data request, require a 403-style failure, and clear the variable.&quot;,&quot;title&quot;:&quot;Prove that Shared Key authorization is denied&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;All hardened properties remain intact after a non-disclosing secondary-key rotation and the OAuth blob path still passes.&quot;,&quot;id&quot;:&quot;LAB06-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-04&quot;,&quot;ST-ACCOUNTS-01&quot;,&quot;ST-ACCOUNTS-02&quot;,&quot;ST-ACCOUNTS-04&quot;],&quot;purpose&quot;:&quot;Renew the unused secondary key without returning it, then verify redundancy, encryption, transport, authorization, and cleanup scope together.&quot;,&quot;title&quot;:&quot;Rotate the secondary key and reconcile the hardened account&quot;}],&quot;title&quot;:&quot;Secure storage accounts, redundancy, encryption, and keys&quot;}</metadata>

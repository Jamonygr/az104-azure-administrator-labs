<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-04">
  <title id="roadmap-title">LAB-04 learning roadmap: Manage hierarchy, resource groups, tags, and locks</title>
  <desc id="roadmap-desc">Manage hierarchy, resource groups, tags, and locks. Follow five checkpoints in lesson order. Task 1, LAB04-CP01: Map management-group, subscription, and resource-group ancestry. Task 2, LAB04-CP02: Merge governance tags without replacing ownership tags. Task 3, LAB04-CP03: Prove that resource-group tags do not inherit automatically. Task 4, LAB04-CP04: Apply and interpret a CanNotDelete lock. Task 5, LAB04-CP05: Exercise an optional tenant-authorized management-group node. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;identity-governance&quot;,&quot;labId&quot;:&quot;LAB-04&quot;,&quot;metadataSource&quot;:&quot;labs/04-resource-hierarchy-tags-locks/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/04-resource-hierarchy-tags-locks/README.md&quot;,&quot;sourceSha256&quot;:&quot;46526c7dd8b75b080e21a5214e6437a70f47755caa80c92f652109f14e301b74&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The resource group has the expected subscription-qualified ID and initial run-ownership tags.&quot;,&quot;id&quot;:&quot;LAB04-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-02&quot;],&quot;purpose&quot;:&quot;Read the hierarchy and establish the exact resource-group ID before applying governance controls.&quot;,&quot;title&quot;:&quot;Map management-group, subscription, and resource-group ancestry&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The three governance tags and the original purpose, labId, runId, and expiresOn ownership tags coexist.&quot;,&quot;id&quot;:&quot;LAB04-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-03&quot;],&quot;purpose&quot;:&quot;Add environment, cost center, and owner metadata through tag merge semantics.&quot;,&quot;title&quot;:&quot;Merge governance tags without replacing ownership tags&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The before query proves no automatic inheritance; the final virtual network has explicit ownership and environment tags.&quot;,&quot;id&quot;:&quot;LAB04-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-04&quot;],&quot;purpose&quot;:&quot;Create an untagged child virtual network, observe the empty tag set, then apply only the intended child tags.&quot;,&quot;title&quot;:&quot;Prove that resource-group tags do not inherit automatically&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;Exactly one CanNotDelete lock exists, its ID is recorded, and a safe child virtual-network delete is rejected.&quot;,&quot;id&quot;:&quot;LAB04-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-05&quot;],&quot;purpose&quot;:&quot;Protect the workload lifecycle boundary and inspect the effective lock by its exact ARM ID.&quot;,&quot;title&quot;:&quot;Apply and interpret a CanNotDelete lock&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;One empty run-specific management group exists only when tenant change is acknowledged and its ID is manifest-recorded.&quot;,&quot;id&quot;:&quot;LAB04-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-GOVERN-02&quot;,&quot;IG-GOVERN-03&quot;,&quot;IG-GOVERN-04&quot;,&quot;IG-GOVERN-05&quot;,&quot;IG-GOVERN-07&quot;],&quot;purpose&quot;:&quot;Create one empty child management group only when the explicit tenant-change gate is present, then record its ARM ID.&quot;,&quot;title&quot;:&quot;Exercise an optional tenant-authorized management-group node&quot;}],&quot;title&quot;:&quot;Manage hierarchy, resource groups, tags, and locks&quot;}</metadata>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1677" viewBox="0 0 640 1677" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-10">
  <title id="roadmap-title">LAB-10 learning roadmap: Interpret, modify, deploy, export, and decompile ARM and Bicep</title>
  <desc id="roadmap-desc">Interpret, modify, deploy, export, and decompile ARM and Bicep. Follow five checkpoints in lesson order. Task 1, LAB10-CP01: Prove Bicep tooling and deployment-scope readiness. Task 2, LAB10-CP02: Build and lint the versioned Bicep template. Task 3, LAB10-CP03: Preview and deploy the ARM change set. Task 4, LAB10-CP04: Export and decompile the deployed template. Task 5, LAB10-CP05: Reconcile deployment output, tags, and ownership state. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;compute&quot;,&quot;labId&quot;:&quot;LAB-10&quot;,&quot;metadataSource&quot;:&quot;labs/10-arm-bicep-lifecycle/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/10-arm-bicep-lifecycle/README.md&quot;,&quot;sourceSha256&quot;:&quot;c3e03382e8bae181b196a51a0be190f21f23100815c8f2eec7dd74c457455130&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;az bicep can build the local template and the target resource group accepts subscription-scoped deployment queries without mutation.&quot;,&quot;id&quot;:&quot;LAB10-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;CP-IAC-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for prove bicep tooling and deployment-scope readiness, without changing Azure state.&quot;,&quot;title&quot;:&quot;Prove Bicep tooling and deployment-scope readiness&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The compiled ARM JSON contains the tagged storage account and the source template remains the authoritative artifact.&quot;,&quot;id&quot;:&quot;LAB10-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;CP-IAC-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to build and lint the versioned bicep template, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Build and lint the versioned Bicep template&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The what-if result is reviewed and the completed deployment returns the exact storage account ID recorded for this run.&quot;,&quot;id&quot;:&quot;LAB10-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;CP-IAC-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to preview and deploy the arm change set.&quot;,&quot;title&quot;:&quot;Preview and deploy the ARM change set&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The exported resource-group template and decompiled Bicep are local review artifacts; neither is silently treated as the original source.&quot;,&quot;id&quot;:&quot;LAB10-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;CP-IAC-04&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to export and decompile the deployed template, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Export and decompile the deployed template&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Deployment provisioningState is Succeeded, the storage ID matches run.json, and no unexpected resource exists in the run-owned group.&quot;,&quot;id&quot;:&quot;LAB10-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;CP-IAC-01&quot;,&quot;CP-IAC-02&quot;,&quot;CP-IAC-03&quot;,&quot;CP-IAC-04&quot;,&quot;CP-IAC-05&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile deployment output, tags, and ownership state before handoff.&quot;,&quot;title&quot;:&quot;Reconcile deployment output, tags, and ownership state&quot;}],&quot;title&quot;:&quot;Interpret, modify, deploy, export, and decompile ARM and Bicep&quot;}</metadata>

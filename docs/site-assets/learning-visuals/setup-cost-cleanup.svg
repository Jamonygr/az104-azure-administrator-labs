<title id="title">Task 4: review cost and cleanup before deployment</title>
<desc id="desc">Inspect the approved region, provider registration states, SKU and quota cost gates, and exact run-tag inventory. Lab 00 creates no Azure resources, so its run-owned inventory should be empty. Do not register providers or delete a conflicting resource automatically.</desc>

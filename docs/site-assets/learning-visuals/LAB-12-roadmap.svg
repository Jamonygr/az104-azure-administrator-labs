<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-12">
  <title id="roadmap-title">LAB-12 learning roadmap: Design VM resilience, scale sets, and mobility</title>
  <desc id="roadmap-desc">Design VM resilience, scale sets, and mobility. Follow five checkpoints in lesson order. Task 1, LAB12-CP01: Verify zone, availability-set, and VMSS regional support. Task 2, LAB12-CP02: Place a VM in the run-owned availability set. Task 3, LAB12-CP03: Deploy a resilient VM scale set with autoscale. Task 4, LAB12-CP04: Move the standalone VM boundary to a second resource group. Task 5, LAB12-CP05: Reconcile placement, scaling, and both ownership boundaries. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;compute&quot;,&quot;labId&quot;:&quot;LAB-12&quot;,&quot;metadataSource&quot;:&quot;labs/12-vm-resilience-scale-mobility/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/12-vm-resilience-scale-mobility/README.md&quot;,&quot;sourceSha256&quot;:&quot;eba24360223fdc1611504103dca4bb1d0a948957b6f5c758c0deaccacc3e4e2e&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The selected region exposes the documented VM SKU plus the placement capabilities required by the availability-set and scale-set designs.&quot;,&quot;id&quot;:&quot;LAB12-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;CP-VM-03&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify zone, availability-set, and vmss regional support, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify zone, availability-set, and VMSS regional support&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The VM resource references the created availability set and its private NIC remains inside the source resource group.&quot;,&quot;id&quot;:&quot;LAB12-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;CP-VM-04&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to place a vm in the run-owned availability set, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Place a VM in the run-owned availability set&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The VMSS has the requested capacity and the autoscale profile contains bounded minimum, default, and maximum instance counts.&quot;,&quot;id&quot;:&quot;LAB12-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;CP-VM-06&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to deploy a resilient vm scale set with autoscale.&quot;,&quot;title&quot;:&quot;Deploy a resilient VM scale set with autoscale&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The selected VM and dependent NIC/disk IDs resolve only in the tagged destination group recorded in run.json.&quot;,&quot;id&quot;:&quot;LAB12-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;CP-VM-07&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to move the standalone vm boundary to a second resource group, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Move the standalone VM boundary to a second resource group&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;Availability-set membership, VMSS capacity/autoscale, and source/destination group inventories all match the manifest.&quot;,&quot;id&quot;:&quot;LAB12-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;CP-VM-03&quot;,&quot;CP-VM-04&quot;,&quot;CP-VM-06&quot;,&quot;CP-VM-07&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile placement, scaling, and both ownership boundaries before handoff.&quot;,&quot;title&quot;:&quot;Reconcile placement, scaling, and both ownership boundaries&quot;}],&quot;title&quot;:&quot;Design VM resilience, scale sets, and mobility&quot;}</metadata>

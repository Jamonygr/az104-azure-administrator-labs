<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-03">
  <title id="roadmap-title">LAB-03 learning roadmap: Assign and interpret Azure RBAC at multiple scopes</title>
  <desc id="roadmap-desc">Assign and interpret Azure RBAC at multiple scopes. Follow five checkpoints in lesson order. Task 1, LAB03-CP01: Resolve the principal and inspect existing scope inheritance. Task 2, LAB03-CP02: Assign Reader at resource-group scope and persist the assignment ID. Task 3, LAB03-CP03: Add a resource-scoped blob data role. Task 4, LAB03-CP04: Inject, detect, and remove an over-privileged assignment. Task 5, LAB03-CP05: Build the final direct-versus-inherited access matrix. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;identity-governance&quot;,&quot;labId&quot;:&quot;LAB-03&quot;,&quot;metadataSource&quot;:&quot;labs/03-azure-rbac-scopes/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/03-azure-rbac-scopes/README.md&quot;,&quot;sourceSha256&quot;:&quot;59fe645398da481dc263977026e2cf5960f263363456d952eb4739cd1db685d5&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The exact principal resolves, Reader exposes control-plane read actions and no blob dataActions, and inherited baseline assignments are visible.&quot;,&quot;id&quot;:&quot;LAB03-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-01&quot;],&quot;purpose&quot;:&quot;Verify the exact principal object, built-in roles, and pre-existing assignments before creating new access.&quot;,&quot;title&quot;:&quot;Resolve the principal and inspect existing scope inheritance&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;One direct Reader assignment exists at the exact resource-group scope and its ID is durable in run.json.&quot;,&quot;id&quot;:&quot;LAB03-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-02&quot;],&quot;purpose&quot;:&quot;Create one least-privilege control-plane assignment at the workload lifecycle boundary.&quot;,&quot;title&quot;:&quot;Assign Reader at resource-group scope and persist the assignment ID&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The storage account inherits Reader and has one direct Storage Blob Data Reader assignment for the principal.&quot;,&quot;id&quot;:&quot;LAB03-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-03&quot;],&quot;purpose&quot;:&quot;Create a tagged storage account and assign Storage Blob Data Reader only at that child resource.&quot;,&quot;title&quot;:&quot;Add a resource-scoped blob data role&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;The Contributor fault is observed once, removed by assignment ID, and retained only as deleted lifecycle evidence.&quot;,&quot;id&quot;:&quot;LAB03-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-01&quot;],&quot;purpose&quot;:&quot;Create a temporary Contributor assignment, persist it before inspection, detect it by exact scope, and delete it by exact ID.&quot;,&quot;title&quot;:&quot;Inject, detect, and remove an over-privileged assignment&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The final matrix shows only Reader inherited from the resource group and Storage Blob Data Reader direct at storage.&quot;,&quot;id&quot;:&quot;LAB03-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;IG-ACCESS-01&quot;,&quot;IG-ACCESS-02&quot;,&quot;IG-ACCESS-03&quot;],&quot;purpose&quot;:&quot;Correlate role definitions, assignment scopes, inheritance, principal ID, and rollback IDs into one least-privilege record.&quot;,&quot;title&quot;:&quot;Build the final direct-versus-inherited access matrix&quot;}],&quot;title&quot;:&quot;Assign and interpret Azure RBAC at multiple scopes&quot;}</metadata>

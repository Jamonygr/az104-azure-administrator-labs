<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1250" viewBox="0 0 700 1250" role="img" aria-labelledby="title desc">
<title id="title">Cleanup boundary: approved run only, with residual evidence</title>
<desc id="desc">Cleanup compares the manifest identity, active Azure context, exact target IDs, and each target’s ownership proof before any mutation. It cleans only the approved run and refuses unrelated targets. After cleanup it queries residuals and records active, retained, or soft-deleted items in cleanup.json. It never automates irreversible purge.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#060c18"/><stop offset="1" stop-color="#0b182c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#68dcff"/></marker></defs>
<rect width="700" height="1250" rx="28" fill="url(#canvas)"/>
<rect x="16" y="16" width="668" height="1218" rx="22" fill="none" stroke="#294460" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="350" y="53" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">Keep cleanup inside</text><text x="350" y="92" font-size="32" fill="#ecf4ff" text-anchor="middle" font-weight="650">the owned run boundary</text><text x="350" y="131" font-size="22" fill="#bac9e1" text-anchor="middle" font-weight="400">Preview targets; use -Execute only after review</text><circle cx="350" cy="220" r="67" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(300 170) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9H61l20 20v62H24Z"/><path d="M61 9v21h20M36 44H67M36 57H67M36 70H56"/></g><text x="350" y="326" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Manifest IDs + active context</text><path d="M350 346L350 385" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="350" cy="455" r="65" fill="#101f36" stroke="#b9a0ff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(300 405) scale(1)" fill="none" stroke="#b9a0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 7L85 20v29q0 27-35 44Q15 76 15 49V20Z"/><path d="M31 49l13 13 26-29"/></g><text x="350" y="559" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Verify exact ownership</text><text x="350" y="596" font-size="23" fill="#bac9e1" text-anchor="middle" font-weight="400">Lab ID · run ID · proof for each target</text><path d="M350 614V645H170M350 645H530" fill="none" stroke="#68dcff" stroke-width="3"/><path d="M170 645L170 685" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 645L530 685" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="170" cy="750" r="60" fill="#101f36" stroke="#7ee6b8" stroke-opacity=".38" stroke-width="2"/><g transform="translate(120 700) scale(1)" fill="none" stroke="#7ee6b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27H84M28 27V16h44v11M23 28l6 58h42l6-58M40 40v33M59 40v33"/><path d="M83 59l10 7v15q0 11-10 17-10-6-10-17V66Z"/></g><circle cx="530" cy="750" r="60" fill="#101f36" stroke="#ff9cac" stroke-opacity=".38" stroke-width="2"/><g transform="translate(480 700) scale(1)" fill="none" stroke="#ff9cac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M29 10H71l19 19v42L71 90H29L10 71V29Z"/><path d="M33 33l34 34M67 33L33 67"/></g><text x="170" y="848" font-size="28" fill="#7ee6b8" text-anchor="middle" font-weight="650">This run only</text><text x="530" y="848" font-size="26" fill="#ff9cac" text-anchor="middle" font-weight="650">Refuse unrelated</text><path d="M170 869L170 916" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><path d="M170 916H350" fill="none" stroke="#68dcff" stroke-width="3"/><path d="M350 916L350 946" fill="none" stroke="#68dcff" stroke-width="3" marker-end="url(#arrow)"/><circle cx="350" cy="1010" r="59" fill="#101f36" stroke="#68dcff" stroke-opacity=".38" stroke-width="2"/><g transform="translate(300 960) scale(1)" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9H63l18 18v64H19Z"/><path d="M63 9v20h18M32 47l7 7 13-15M58 48H69M32 69l7 7 13-15M58 70H69"/></g><text x="350" y="1107" font-size="28" fill="#ecf4ff" text-anchor="middle" font-weight="650">Query residuals → cleanup.json</text><text x="350" y="1162" font-size="24" fill="#bac9e1" text-anchor="middle" font-weight="400">Report active, retained, or soft-deleted items.</text><text x="350" y="1198" font-size="24" fill="#bac9e1" text-anchor="middle" font-weight="400">Irreversible purge is never automated.</text></g>
</svg>

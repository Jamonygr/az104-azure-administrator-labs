<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-22">
  <title id="roadmap-title">LAB-22 learning roadmap: Collect and analyze Azure Monitor metrics, logs, and Insights</title>
  <desc id="roadmap-desc">Collect and analyze Azure Monitor metrics, logs, and Insights. Follow five checkpoints in lesson order. Task 1, LAB22-CP01: Verify Log Analytics, diagnostic, and KQL prerequisites. Task 2, LAB22-CP02: Create the monitored storage account and workspace. Task 3, LAB22-CP03: Route resource metrics into Log Analytics. Task 4, LAB22-CP04: Generate a transaction and prove KQL ingestion. Task 5, LAB22-CP05: Reconcile diagnostic configuration and ingested telemetry. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;monitor-recovery&quot;,&quot;labId&quot;:&quot;LAB-22&quot;,&quot;metadataSource&quot;:&quot;labs/22-azure-monitor-logs-insights/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/22-azure-monitor-logs-insights/README.md&quot;,&quot;sourceSha256&quot;:&quot;fe1878fb13fffe730415c4f8fc4c0897ed44595a3a3c914b0c6b51732d481563&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The workspace and diagnostic-setting APIs are available and the planned resource exposes a metric category that can be collected.&quot;,&quot;id&quot;:&quot;LAB22-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-01&quot;],&quot;purpose&quot;:&quot;Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify log analytics, diagnostic, and kql prerequisites, without changing Azure state.&quot;,&quot;title&quot;:&quot;Verify Log Analytics, diagnostic, and KQL prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;The storage account and Log Analytics workspace IDs are immediately recorded in the run manifest.&quot;,&quot;id&quot;:&quot;LAB22-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-02&quot;],&quot;purpose&quot;:&quot;Provision and immediately inventory the exact run-owned resources needed to create the monitored storage account and workspace, so partial completion remains recoverable.&quot;,&quot;title&quot;:&quot;Create the monitored storage account and workspace&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The diagnostic setting targets the run-owned workspace and enables the supported metrics category for the storage resource.&quot;,&quot;id&quot;:&quot;LAB22-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-03&quot;],&quot;purpose&quot;:&quot;Configure and independently inspect the control-plane and data-path properties needed to route resource metrics into log analytics.&quot;,&quot;title&quot;:&quot;Route resource metrics into Log Analytics&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;A harmless storage data-plane operation is followed by a bounded query that finds at least one matching AzureMetrics row for the exact resource ID.&quot;,&quot;id&quot;:&quot;LAB22-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-05&quot;],&quot;purpose&quot;:&quot;Exercise the deterministic operational or denied path needed to generate a transaction and prove kql ingestion, then retain comparable before-and-after results.&quot;,&quot;title&quot;:&quot;Generate a transaction and prove KQL ingestion&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The destination workspace ID, enabled category, deterministic transaction, and asserted KQL result form one traceable monitoring path.&quot;,&quot;id&quot;:&quot;LAB22-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;MR-MONITOR-01&quot;,&quot;MR-MONITOR-02&quot;,&quot;MR-MONITOR-03&quot;,&quot;MR-MONITOR-05&quot;,&quot;MR-MONITOR-06&quot;],&quot;purpose&quot;:&quot;Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile diagnostic configuration and ingested telemetry before handoff.&quot;,&quot;title&quot;:&quot;Reconcile diagnostic configuration and ingested telemetry&quot;}],&quot;title&quot;:&quot;Collect and analyze Azure Monitor metrics, logs, and Insights&quot;}</metadata>

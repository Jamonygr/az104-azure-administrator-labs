<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="roadmap-title roadmap-desc" data-lab-id="LAB-09">
  <title id="roadmap-title">LAB-09 learning roadmap: Configure Azure Files, snapshots, soft delete, and identity access</title>
  <desc id="roadmap-desc">Configure Azure Files, snapshots, soft delete, and identity access. Follow five checkpoints in lesson order. Task 1, LAB09-CP01: Baseline name, provider, and optional identity prerequisites. Task 2, LAB09-CP02: Create a bounded SMB share and enable share soft delete. Task 3, LAB09-CP03: Write sample content and capture a share snapshot. Task 4, LAB09-CP04: Configure the gated Entra Kerberos and share-RBAC path. Task 5, LAB09-CP05: Delete and restore the protected share, then reconcile readiness. Offline-validated curriculum. Consult the lesson for commands, approval gates, and cleanup.</desc>
  <metadata>{&quot;domain&quot;:&quot;storage&quot;,&quot;labId&quot;:&quot;LAB-09&quot;,&quot;metadataSource&quot;:&quot;labs/09-azure-files-identity/lab.yml&quot;,&quot;renderer&quot;:&quot;az104-checkpoint-roadmap-svg/1.0.0&quot;,&quot;source&quot;:&quot;labs/09-azure-files-identity/README.md&quot;,&quot;sourceSha256&quot;:&quot;4482e6c0cdd56d4dd647a5a62584f8e6db6e7fded9e1e7b06e35f68c8050f7b6&quot;,&quot;status&quot;:&quot;offline-validated&quot;,&quot;tasks&quot;:[{&quot;anchor&quot;:&quot;#task-1&quot;,&quot;expectedState&quot;:&quot;The deterministic account name is available and any requested identity source exactly selects the documented gated path.&quot;,&quot;id&quot;:&quot;LAB09-CP01&quot;,&quot;number&quot;:1,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-05&quot;],&quot;purpose&quot;:&quot;Confirm global name availability and inventory the optional directory-source request before any storage mutation.&quot;,&quot;title&quot;:&quot;Baseline name, provider, and optional identity prerequisites&quot;},{&quot;anchor&quot;:&quot;#task-2&quot;,&quot;expectedState&quot;:&quot;A tagged Standard_LRS account contains one 20-GiB transaction-optimized SMB share and seven-day share soft delete is enabled.&quot;,&quot;id&quot;:&quot;LAB09-CP02&quot;,&quot;number&quot;:2,&quot;objectiveIds&quot;:[&quot;ST-ACCOUNTS-05&quot;],&quot;purpose&quot;:&quot;Create and immediately record the storage account and ARM file-share IDs, then enable seven-day share recovery.&quot;,&quot;title&quot;:&quot;Create a bounded SMB share and enable share soft delete&quot;},{&quot;anchor&quot;:&quot;#task-3&quot;,&quot;expectedState&quot;:&quot;The active share contains sample.txt and an ARM-visible snapshot time is recorded without an account key in state.&quot;,&quot;id&quot;:&quot;LAB09-CP03&quot;,&quot;number&quot;:3,&quot;objectiveIds&quot;:[&quot;ST-DATA-01&quot;],&quot;purpose&quot;:&quot;Bootstrap one real file using a key held only in memory, then persist the returned snapshot time immediately.&quot;,&quot;title&quot;:&quot;Write sample content and capture a share snapshot&quot;},{&quot;anchor&quot;:&quot;#task-4&quot;,&quot;expectedState&quot;:&quot;AADKERB is the only identity source and the approved principal has exactly the intended share-scoped SMB data role after the missing-role fault is repaired.&quot;,&quot;id&quot;:&quot;LAB09-CP04&quot;,&quot;number&quot;:4,&quot;objectiveIds&quot;:[&quot;ST-DATA-05&quot;],&quot;purpose&quot;:&quot;With exact authorization inputs, enable the single supported identity source, inject a missing-role fault, and restore the least-privileged share data role.&quot;,&quot;title&quot;:&quot;Configure the gated Entra Kerberos and share-RBAC path&quot;},{&quot;anchor&quot;:&quot;#task-5&quot;,&quot;expectedState&quot;:&quot;The original share generation is soft-deleted, identified by deletedVersion, restored under the same name, and its sample content remains readable.&quot;,&quot;id&quot;:&quot;LAB09-CP05&quot;,&quot;number&quot;:5,&quot;objectiveIds&quot;:[&quot;ST-ACCESS-05&quot;,&quot;ST-ACCOUNTS-05&quot;,&quot;ST-DATA-01&quot;,&quot;ST-DATA-05&quot;],&quot;purpose&quot;:&quot;Exercise share soft delete against the real sample, persist the deleted-version recovery target, restore it, and prove content survived.&quot;,&quot;title&quot;:&quot;Delete and restore the protected share, then reconcile readiness&quot;}],&quot;title&quot;:&quot;Configure Azure Files, snapshots, soft delete, and identity access&quot;}</metadata>

name: Offline quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository contract
        run: python tools/validate_repository.py --release

      - name: Confirm generated labs and inline command lanes are synchronized
        run: python tools/generate_labs.py --check

      - name: Confirm Mermaid sources and accessible SVGs are synchronized
        run: python tools/render_diagrams.py --check

      - name: Validate supplementary learning visuals
        run: |
          python tools/render_learning_visuals.py --check
          python tools/render_setup_visuals.py --check
          python -m unittest tools.tests.test_learning_visuals -v

      - name: Confirm generated indexes are current
        run: python tools/generate_indexes.py --check

      - name: Confirm 50-question lab assessments are current
        run: python tools/expand_assessments.py --check

      - name: Validate all 1,250 authored assessment records
        run: python tools/validate_assessments.py

      - name: Set up Node.js for browser learning checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate quizzes and progress compatibility
        run: |
          node --check docs/site-assets/progress.js
          node --check docs/site-assets/quiz.js
          node --test tools/tests/browser_learning.test.cjs

      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell command lanes
        shell: pwsh
        run: |
          $scripts = Get-ChildItem labs -Recurse -Filter '*.ps1' |
            Where-Object { $_.FullName -match '[\\/]scripts[\\/]cli[\\/]' }
          $scripts = @(
            $scripts
            Get-Item tools/Initialize-LabEnvironment.ps1
            Get-Item tools/Test-LabEnvironment.ps1
            Get-Item tools/Update-LearnerProgress.ps1
          )
          $findings = $scripts | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error
          }
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw 'PSScriptAnalyzer reported warning or error findings.'
          }

      - name: Run offline Pester safety contracts
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path labs -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s)."
          }

  static-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.14.0

      - name: Spell-check documentation
        run: npx --yes cspell@8.14.4 --no-progress "**/*.md"

      - name: Set up Python for verified quality tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install checksum-verified quality tools
        run: python tools/install_check_tools.py

      - name: Lint GitHub Actions workflows
        run: .check-tools/actionlint

      - name: Scan for committed secrets
        run: .check-tools/gitleaks git . --redact --no-banner

      - name: Build and lint Bicep artifacts
        run: |
          az bicep install --version v0.46.1
          az config set bicep.check_version=false
          find labs -type f -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep lint --file {}
          find labs -type f -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep build --file {} --outdir /tmp

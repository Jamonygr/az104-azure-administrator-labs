<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2036" height="672" viewBox="0 0 2036 672" role="img" aria-labelledby="lab00-title lab00-desc">
  <title id="lab00-title">LAB-00 architecture: Safe Azure lab bootstrap</title>
  <desc id="lab00-desc">Illustrated service topology with 7 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Learner, Environment initializer, Version and dependency checks, Read-only Azure CLI context, Ignored run manifest, Setup and cleanup previews, Validation and residual audit. Relationships: Learner to Environment initializer (run one PowerShell command); Environment initializer to Version and dependency checks (inspect only); Version and dependency checks to Read-only Azure CLI context (required tools pass); Read-only Azure CLI context to Ignored run manifest (approved cloud and subscription); Ignored run manifest to Setup and cleanup previews (exact IDs, tags, and gates); Setup and cleanup previews to Validation and residual audit (no mutation in Lab 00); Validation and residual audit to Ignored run manifest (readiness and cleanup results); Ignored run manifest to Learner (safe boundary understood).</desc>
  <metadata id="lab00-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/2.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;0b1aed881e472530657776b37c6b2c40299a7a3ac8edb94958a943f49755a803&quot;}</metadata>

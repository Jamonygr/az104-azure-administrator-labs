  <title id="lab05-title">LAB-05 architecture: Enforce policy and manage costs with budgets and Advisor</title>
  <desc id="lab05-desc">Illustrated service topology with 10 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Built-in require-tag deny Policy, Policy assignment purpose equals az104-lab, Governed resource group, Tagged storage account, Policy denial evidence, Budget 80 percent actual, Action group, Budget email, Azure Advisor Cost category, Administrator review. Relationships: Built-in require-tag deny Policy to Policy assignment purpose equals az104-lab; Policy assignment purpose equals az104-lab to Governed resource group (resource-group scope); Governed resource group to Tagged storage account (compliant request); Governed resource group to Policy denial evidence (deny untagged request); Governed resource group to Budget 80 percent actual (monthly cost scope); Budget 80 percent actual to Action group (contact group ID); Action group to Budget email (optional approved receiver); Azure Advisor Cost category to Administrator review (read-only recommendations).</desc>

  <title id="lab17-title">LAB-17 architecture: Create VNets, subnets, peerings, and public IPs</title>
  <desc id="lab17-desc">Illustrated service topology with 9 components and 10 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Operator and Azure CLI, Hub VNet, Hub-to-spoke peering, Spoke VNet and subnets, Spoke-to-hub peering, Standard static public IP, Controlled public edge, CIDR and peering assertions, Peering before VNet cleanup. Relationships: Operator and Azure CLI to Hub VNet; Hub VNet to Hub-to-spoke peering; Hub-to-spoke peering to Spoke VNet and subnets; Spoke VNet and subnets to Spoke-to-hub peering; Spoke-to-hub peering to Hub VNet; Standard static public IP to Controlled public edge; Hub VNet to CIDR and peering assertions; Spoke VNet and subnets to CIDR and peering assertions; Controlled public edge to CIDR and peering assertions; CIDR and peering assertions to Peering before VNet cleanup.</desc>

  <title id="lab16-title">LAB-16 architecture: Configure App Service TLS, DNS, backup, and networking</title>
  <desc id="lab16-desc">Illustrated service topology with 10 components and 9 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Operator and Azure CLI, HTTPS-only App Service, TLS and managed certificate, Delegated VNet subnet, Backup configuration, Transient redacted SAS, Private Blob container, Owned hostname gate, TLS, DNS, backup, and VNet assertions, Secret-free cleanup. Relationships: Operator and Azure CLI to HTTPS-only App Service; HTTPS-only App Service to TLS and managed certificate; HTTPS-only App Service to Delegated VNet subnet; HTTPS-only App Service to Backup configuration; Backup configuration to Transient redacted SAS; Transient redacted SAS to Private Blob container; Owned hostname gate to TLS and managed certificate; HTTPS-only App Service to TLS, DNS, backup, and VNet assertions; TLS, DNS, backup, and VNet assertions to Secret-free cleanup.</desc>

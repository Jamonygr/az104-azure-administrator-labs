  <title id="lab19-title">LAB-19 architecture: Compare service endpoints and private endpoints</title>
  <desc id="lab19-desc">Illustrated service topology with 9 components and 10 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: VNet client path, Linked private DNS zone, Blob private A record, Blob private endpoint, Public-disabled storage, Private DNS zone group, Public endpoint denied, Approval, IP, DNS, and policy assertions, Endpoint before DNS cleanup. Relationships: VNet client path to Linked private DNS zone; Linked private DNS zone to Blob private A record; Blob private A record to Blob private endpoint; Blob private endpoint to Public-disabled storage; Private DNS zone group to Blob private A record; Blob private endpoint to Private DNS zone group; Public-disabled storage to Public endpoint denied; Blob private endpoint to Approval, IP, DNS, and policy assertions; Public endpoint denied to Approval, IP, DNS, and policy assertions; Approval, IP, DNS, and policy assertions to Endpoint before DNS cleanup.</desc>

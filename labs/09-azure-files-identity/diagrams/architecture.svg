<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1504" viewBox="0 0 1526 1504" role="img" aria-labelledby="lab09-title lab09-desc">
  <title id="lab09-title">LAB-09 architecture: Configure Azure Files, snapshots, soft delete, and identity access</title>
  <desc id="lab09-desc">Illustrated service topology with 10 components and 9 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Azure CLI control plane, StorageV2 account, Bounded SMB file share, Account key memory only, Share snapshot after content, Seven-day soft delete, Approved Entra principal, Azure Files SMB endpoint, SMB Share Contributor exact share scope, Tenant consent, CA, client and ACL gates. Relationships: Azure CLI control plane to StorageV2 account; StorageV2 account to Bounded SMB file share; Account key memory only to Bounded SMB file share (bootstrap sample); Bounded SMB file share to Share snapshot after content; Seven-day soft delete to Bounded SMB file share (delete and restore); Approved Entra principal to Azure Files SMB endpoint (Kerberos ticket); Azure Files SMB endpoint to Bounded SMB file share; SMB Share Contributor exact share scope to Bounded SMB file share (authorizes principal); Tenant consent, CA, client and ACL gates to Azure Files SMB endpoint.</desc>
  <metadata id="lab09-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/2.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;5eecce8dd507972b5abb663a1e041203debc30e558fc0db8a73d5354aeb5f95a&quot;}</metadata>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1064" viewBox="0 0 1526 1064" role="img" aria-labelledby="lab03-title lab03-desc">
  <title id="lab03-title">LAB-03 architecture: Assign and interpret Azure RBAC at multiple scopes</title>
  <desc id="lab03-desc">Illustrated service topology with 7 components and 7 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Disposable principal, Resource group, Storage account, Reader role definition control-plane read, Blob Data Reader definition blob dataActions, Temporary Contributor assignment, Effective role matrix. Relationships: Disposable principal to Resource group (Reader assignment); Resource group to Storage account (scope inheritance); Disposable principal to Storage account (Blob Data Reader
direct assignment); Reader role definition control-plane read to Resource group; Blob Data Reader definition blob dataActions to Storage account; Temporary Contributor assignment to Resource group (detect and remove by ID); Storage account to Effective role matrix (include inherited).</desc>

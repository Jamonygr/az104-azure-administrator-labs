  <title id="lab21-title">LAB-21 architecture: Load balance workloads and troubleshoot with Network Watcher</title>
  <desc id="lab21-desc">Illustrated service topology with 11 components and 13 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Internet client, Standard public frontend, TCP load-balancing rule, TCP health probe, Backend pool, Private VM 1 and agent, Private VM 2 and agent, Outbound rule, Connection Monitor TCP test, Health and path assertions, Monitor before workload cleanup. Relationships: Internet client to Standard public frontend; Standard public frontend to TCP load-balancing rule; TCP health probe to Backend pool; TCP load-balancing rule to Backend pool; Backend pool to Private VM 1 and agent; Backend pool to Private VM 2 and agent; Outbound rule to Standard public frontend; Private VM 1 and agent to Outbound rule; Private VM 2 and agent to Outbound rule; Private VM 1 and agent to Connection Monitor TCP test; Connection Monitor TCP test to Private VM 2 and agent; Connection Monitor TCP test to Health and path assertions; Health and path assertions to Monitor before workload cleanup.</desc>

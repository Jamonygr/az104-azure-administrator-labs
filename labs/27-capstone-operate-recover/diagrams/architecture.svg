  <title id="lab27-title">LAB-27 architecture: Capstone — Operate, troubleshoot, back up, and recover an Azure workload</title>
  <desc id="lab27-desc">Illustrated service topology with 12 components and 13 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Private workload VM, Effective NSG path, Injected deny and repair, Storage transaction, Diagnostic setting, Log Analytics and KQL, Scoped metric alert, Recovery protection, Recovery point, Disk restore artifact, Network, telemetry, alert, and recovery assertions, Workload cleanup and deleted-vault proof. Relationships: Private workload VM to Effective NSG path; Injected deny and repair to Effective NSG path; Storage transaction to Diagnostic setting; Diagnostic setting to Log Analytics and KQL; Storage transaction to Scoped metric alert; Private workload VM to Recovery protection; Recovery protection to Recovery point; Recovery point to Disk restore artifact; Effective NSG path to Network, telemetry, alert, and recovery assertions; Log Analytics and KQL to Network, telemetry, alert, and recovery assertions; Scoped metric alert to Network, telemetry, alert, and recovery assertions; Disk restore artifact to Network, telemetry, alert, and recovery assertions; Network, telemetry, alert, and recovery assertions to Workload cleanup and deleted-vault proof.</desc>

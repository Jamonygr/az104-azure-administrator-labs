  <title id="lab18-title">LAB-18 architecture: Control traffic with routes, NSGs, ASGs, and effective rules</title>
  <desc id="lab18-desc">Illustrated service topology with 9 components and 11 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Frontend VM and NIC, Frontend ASG, Backend VM and NIC, Backend ASG, ASG-aware NSG rule, Route table, Application subnet, Effective NSG and route queries, NIC and policy cleanup. Relationships: Frontend VM and NIC to Frontend ASG; Backend VM and NIC to Backend ASG; Frontend ASG to ASG-aware NSG rule; ASG-aware NSG rule to Backend ASG; Route table to Application subnet; ASG-aware NSG rule to Application subnet; Application subnet to Frontend VM and NIC; Application subnet to Backend VM and NIC; Frontend VM and NIC to Effective NSG and route queries; Backend VM and NIC to Effective NSG and route queries; Effective NSG and route queries to NIC and policy cleanup.</desc>

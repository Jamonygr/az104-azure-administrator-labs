<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="1284" viewBox="0 0 1016 1284" role="img" aria-labelledby="lab04-title lab04-desc">
  <title id="lab04-title">LAB-04 architecture: Manage hierarchy, resource groups, tags, and locks</title>
  <desc id="lab04-desc">Illustrated service topology with 8 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Tenant root management group, Subscription, Empty lab management group, Tagged resource group, Virtual network, Governance and ownership tags, CanNotDelete lock, Dependency-aware cleanup. Relationships: Tenant root management group to Subscription (existing hierarchy); Tenant root management group to Empty lab management group (optional exact-YES gate); Subscription to Tagged resource group (contains); Tagged resource group to Virtual network (contains); Governance and ownership tags to Tagged resource group (merge); Governance and ownership tags to Virtual network (explicit apply
no inheritance); CanNotDelete lock to Tagged resource group (protects control plane); Dependency-aware cleanup to CanNotDelete lock (remove exact lock first).</desc>

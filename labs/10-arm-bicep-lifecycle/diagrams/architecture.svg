  <title id="lab10-title">LAB-10 architecture: Interpret, modify, deploy, export, and decompile ARM and Bicep</title>
  <desc id="lab10-desc">Illustrated service topology with 8 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Operator and Bicep, Bicep source, Build and ARM what-if, Resource-group deployment, Tagged StorageV2 account, Export and decompile, ID, TLS, and tag assertions, Manifest-scoped cleanup. Relationships: Operator and Bicep to Bicep source; Bicep source to Build and ARM what-if; Build and ARM what-if to Resource-group deployment; Resource-group deployment to Tagged StorageV2 account; Resource-group deployment to Export and decompile; Tagged StorageV2 account to ID, TLS, and tag assertions; Export and decompile to ID, TLS, and tag assertions; ID, TLS, and tag assertions to Manifest-scoped cleanup.</desc>

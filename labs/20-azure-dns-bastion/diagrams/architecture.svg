  <title id="lab20-title">LAB-20 architecture: Configure Azure DNS and secure administration with Bastion</title>
  <desc id="lab20-desc">Illustrated service topology with 11 components and 10 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Administrator, Azure Bastion, Standard static public IP, AzureBastionSubnet, Private workload VNet, Verified Azure DNS parent, Gated child NS delegation, Child Azure DNS zone, A, CNAME, and TXT records, Bastion and DNS authority assertions, Delegation before child cleanup. Relationships: Administrator to Azure Bastion; Standard static public IP to Azure Bastion; Azure Bastion to AzureBastionSubnet; AzureBastionSubnet to Private workload VNet; Verified Azure DNS parent to Gated child NS delegation; Gated child NS delegation to Child Azure DNS zone; Child Azure DNS zone to A, CNAME, and TXT records; Azure Bastion to Bastion and DNS authority assertions; A, CNAME, and TXT records to Bastion and DNS authority assertions; Bastion and DNS authority assertions to Delegation before child cleanup.</desc>

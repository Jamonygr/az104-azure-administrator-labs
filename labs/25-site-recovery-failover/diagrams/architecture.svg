  <title id="lab25-title">LAB-25 architecture: Replicate and fail over an Azure VM with Site Recovery</title>
  <desc id="lab25-desc">Illustrated service topology with 12 components and 11 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Source VM and disk, Source fabric and container, Cache storage, Gated protected item, Replication policy, Container mapping, Recovery fabric and VNet, Gated isolated test failover, Unpeered test VNet, Async test cleanup, Health, mapping, and isolation assertions, Protected item before parent cleanup. Relationships: Source VM and disk to Source fabric and container; Cache storage to Source fabric and container; Source fabric and container to Gated protected item; Replication policy to Gated protected item; Gated protected item to Container mapping; Container mapping to Recovery fabric and VNet; Gated protected item to Gated isolated test failover; Gated isolated test failover to Unpeered test VNet; Gated isolated test failover to Async test cleanup; Async test cleanup to Health, mapping, and isolation assertions; Health, mapping, and isolation assertions to Protected item before parent cleanup.</desc>

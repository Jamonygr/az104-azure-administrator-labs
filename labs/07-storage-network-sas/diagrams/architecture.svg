<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1284" viewBox="0 0 1526 1284" role="img" aria-labelledby="lab07-title lab07-desc">
  <title id="lab07-title">LAB-07 architecture: Restrict storage networking and issue scoped SAS access</title>
  <desc id="lab07-desc">Illustrated service topology with 9 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Authorized workload subnet, Storage firewall default deny, Public storage endpoint, Private blob container, Stored access policy revocation point, Short-lived service SAS, Unapproved learner workstation, Denied data request, Break and restore subnet rule. Relationships: Authorized workload subnet to Storage firewall default deny (Microsoft.Storage
service endpoint); Public storage endpoint to Storage firewall default deny; Storage firewall default deny to Private blob container (allowed subnet only); Stored access policy revocation point to Short-lived service SAS; Short-lived service SAS to Private blob container (authorization proof); Unapproved learner workstation to Storage firewall default deny (SAS request); Storage firewall default deny to Denied data request (network denial); Break and restore subnet rule to Storage firewall default deny.</desc>

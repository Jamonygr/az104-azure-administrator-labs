  <title id="lab23-title">LAB-23 architecture: Build Azure Monitor alerts, action groups, and processing rules</title>
  <desc id="lab23-desc">Illustrated service topology with 8 components and 10 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Storage account, Metric alert, Activity alert, Action group, Optional email receiver, Bounded processing rule, Scope, criteria, and action assertions, Rules before target cleanup. Relationships: Storage account to Metric alert; Storage account to Activity alert; Metric alert to Action group; Activity alert to Action group; Optional email receiver to Action group; Bounded processing rule to Metric alert; Bounded processing rule to Activity alert; Action group to Scope, criteria, and action assertions; Bounded processing rule to Scope, criteria, and action assertions; Scope, criteria, and action assertions to Rules before target cleanup.</desc>

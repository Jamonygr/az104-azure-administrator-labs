  <title id="lab22-title">LAB-22 architecture: Collect and analyze Azure Monitor metrics, logs, and Insights</title>
  <desc id="lab22-desc">Illustrated service topology with 9 components and 8 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Harmless Blob transaction, Storage account, Transactions metric, Diagnostic setting, Log Analytics workspace, Bounded KQL query, Assert row count above zero, Collection and destination assertions, Diagnostic before workspace cleanup. Relationships: Harmless Blob transaction to Storage account; Storage account to Transactions metric; Transactions metric to Diagnostic setting; Diagnostic setting to Log Analytics workspace; Log Analytics workspace to Bounded KQL query; Bounded KQL query to Assert row count above zero; Assert row count above zero to Collection and destination assertions; Collection and destination assertions to Diagnostic before workspace cleanup.</desc>

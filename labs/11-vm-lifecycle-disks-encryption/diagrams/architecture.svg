  <title id="lab11-title">LAB-11 architecture: Manage VM lifecycle, size, disks, and host encryption</title>
  <desc id="lab11-desc">Illustrated service topology with 8 components and 7 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Operator and Azure CLI, Private NIC and subnet, VM with encryption at host, Managed OS disk, Attached data disk, Deallocate, resize, start, Instance and security assertions, Dependency-aware cleanup. Relationships: Operator and Azure CLI to Private NIC and subnet; Private NIC and subnet to VM with encryption at host; VM with encryption at host to Managed OS disk; VM with encryption at host to Attached data disk; VM with encryption at host to Deallocate, resize, start; Deallocate, resize, start to Instance and security assertions; Instance and security assertions to Dependency-aware cleanup.</desc>

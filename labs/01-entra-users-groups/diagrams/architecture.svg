<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2036" height="1064" viewBox="0 0 2036 1064" role="img" aria-labelledby="lab01-title lab01-desc">
  <title id="lab01-title">LAB-01 architecture: Create and manage Microsoft Entra users and groups</title>
  <desc id="lab01-desc">Illustrated service topology with 8 components and 9 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Identity administrator, Microsoft Graph v1.0, Alex cloud user, Blair cloud user, Operations security group, Local run.json users and group, Independent validation, Scoped cleanup. Relationships: Identity administrator to Microsoft Graph v1.0 (az rest); Microsoft Graph v1.0 to Alex cloud user (create); Microsoft Graph v1.0 to Blair cloud user (create); Microsoft Graph v1.0 to Operations security group (create); Alex cloud user to Operations security group (direct member); Blair cloud user to Operations security group (explicit owner); Microsoft Graph v1.0 to Local run.json users and group (returned immutable IDs); Local run.json users and group to Independent validation (exact-ID queries); Local run.json users and group to Scoped cleanup (group first, then users).</desc>
  <metadata id="lab01-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/2.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;675b6f15f897abf9b9991a9d0bdabc76d26717c23f8aaabce001cba697fa2665&quot;}</metadata>

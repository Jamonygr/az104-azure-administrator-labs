<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1064" viewBox="0 0 1526 1064" role="img" aria-labelledby="lab02-title lab02-desc">
  <title id="lab02-title">LAB-02 architecture: Manage Entra licenses, guests, and self-service password reset</title>
  <desc id="lab02-desc">Illustrated service topology with 10 components and 10 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Identity administrator, Microsoft Graph, SSPR pilot security group, Guest user, Subscribed SKU capacity, Authorization policy administrator SSPR, Registration report actual capability, run.json, Policy restore, License removal then object cleanup. Relationships: Identity administrator to Microsoft Graph (az rest); Microsoft Graph to SSPR pilot security group (required create); Microsoft Graph to Guest user (optional invitation); Guest user to SSPR pilot security group (direct membership); Subscribed SKU capacity to Guest user (optional exact SKU); Microsoft Graph to Authorization policy administrator SSPR (read and gated PATCH); Microsoft Graph to Registration report actual capability (read only); run.json to Policy restore (original Boolean); Policy restore to Authorization policy administrator SSPR; run.json to License removal then object cleanup (exact guest and group IDs).</desc>
  <metadata id="lab02-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/2.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;f7449ec6fd8930579479cc7baed201333e547df1ea15bff674a8c7e603567764&quot;}</metadata>

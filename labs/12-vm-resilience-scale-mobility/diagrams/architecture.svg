  <title id="lab12-title">LAB-12 architecture: Design VM resilience, scale sets, and mobility</title>
  <desc id="lab12-desc">Illustrated service topology with 9 components and 9 directed relationships. Original left-to-right ranks continue on the next row when necessary. Components: Operator and Azure CLI, Source tagged resource group, Availability set and VM, VM scale set, Autoscale profile, VM dependency move, Destination tagged resource group, Placement and scale assertions, Two-boundary cleanup. Relationships: Operator and Azure CLI to Source tagged resource group; Source tagged resource group to Availability set and VM; Source tagged resource group to VM scale set; VM scale set to Autoscale profile; Availability set and VM to VM dependency move; VM dependency move to Destination tagged resource group; Autoscale profile to Placement and scale assertions; Destination tagged resource group to Placement and scale assertions; Placement and scale assertions to Two-boundary cleanup.</desc>
